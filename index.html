<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mon programme muscu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2563EB">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone app — scrolling view on top, fixed rest timer and tab bar at the bottom. */
:root {
  --bg: #F3F4F6; --surface: #FFFFFF; --ink: #14171C; --muted: #646B78; --line: #E2E5EA;
  --panel: #EEF0F4; --fig: #14171C; --equip: #DADEE5; --equip-line: #A6ADB9;
  --good: #16A34A; --bad: #DC2626; --on-acc: #FFFFFF;
  --acc: #2563EB;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
.d-lundi { --acc: #2563EB; } .d-mardi { --acc: #0D9488; } .d-vendredi { --acc: #EA580C; } .d-samedi { --acc: #7C3AED; }
.d-mercredi { --acc: #CA8A04; } .d-jeudi, .d-dimanche { --acc: #6B7280; } .d-food { --acc: #14171C; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F12; --surface: #171A1F; --ink: #EEF0F3; --muted: #99A0AC; --line: #2A2E36;
    --panel: #1E2228; --fig: #F1F3F6; --equip: #2C3139; --equip-line: #5F6774; --good: #22C55E; --bad: #F05252;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .d-lundi { --acc: #5B8DEF; } :root:not([data-theme="light"]) .d-mardi { --acc: #2DB8AA; }
  :root:not([data-theme="light"]) .d-vendredi { --acc: #F07A3C; } :root:not([data-theme="light"]) .d-samedi { --acc: #A07CF4; }
  :root:not([data-theme="light"]) .d-mercredi { --acc: #E0A82E; } :root:not([data-theme="light"]) .d-jeudi, :root:not([data-theme="light"]) .d-dimanche { --acc: #8A919E; }
  :root:not([data-theme="light"]) .d-food { --acc: #EEF0F3; --on-acc: #14171C; }
}
:root[data-theme="dark"] {
  --bg: #0D0F12; --surface: #171A1F; --ink: #EEF0F3; --muted: #99A0AC; --line: #2A2E36;
  --panel: #1E2228; --fig: #F1F3F6; --equip: #2C3139; --equip-line: #5F6774; --good: #22C55E; --bad: #F05252;
  color-scheme: dark;
}
:root[data-theme="dark"] .d-lundi { --acc: #5B8DEF; } :root[data-theme="dark"] .d-mardi { --acc: #2DB8AA; }
:root[data-theme="dark"] .d-vendredi { --acc: #F07A3C; } :root[data-theme="dark"] .d-samedi { --acc: #A07CF4; }
:root[data-theme="dark"] .d-mercredi { --acc: #E0A82E; } :root[data-theme="dark"] .d-jeudi, :root[data-theme="dark"] .d-dimanche { --acc: #8A919E; }
:root[data-theme="dark"] .d-food { --acc: #EEF0F3; --on-acc: #14171C; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.app { min-height: 100%; padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 96px) max(16px, env(safe-area-inset-left)); max-width: 640px; margin: 0 auto; }
.timer-on .app { padding-bottom: calc(env(safe-area-inset-bottom) + 168px); }

/* day picker */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 12px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 1 1 0; min-width: 58px; border-radius: 12px; padding: 7px 10px 6px; background: var(--surface); border: 1px solid var(--line); text-align: center; position: relative; }
.chip b { display: block; font-family: var(--display); font-size: 18px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; line-height: 1.05; }
.chip span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.chip[aria-pressed="true"] span { color: var(--on-acc); opacity: .85; }
.chip .today { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
.chip[aria-pressed="true"] .today { background: var(--on-acc); }

/* hero */
.hero { background: var(--acc); color: var(--on-acc); border-radius: 20px; padding: 16px 18px 16px; margin-bottom: 14px; }
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hero h1 { font-family: var(--display); font-size: 40px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; line-height: .95; }
.hero h2 { font-size: 18px; font-weight: 700; margin-top: 6px; text-wrap: balance; }
.hero p { font-size: 14px; font-weight: 500; opacity: .88; margin-top: 2px; }
.ring { flex: none; width: 64px; height: 64px; position: relative; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: currentColor; opacity: .25; }
.ring .fg { stroke: currentColor; stroke-linecap: round; transition: stroke-dashoffset .3s; }
.ring div { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hero-bar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.hero-bar span { font-size: 13px; font-weight: 600; background: rgba(255,255,255,.18); border-radius: 99px; padding: 4px 10px; }
.d-food .hero-bar span, :root[data-theme="dark"] .d-food .hero-bar span { background: color-mix(in srgb, var(--on-acc) 16%, transparent); }

/* exercise cards */
.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.card.done { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.art { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pose { background: var(--panel); border-radius: 12px; padding: 4px 4px 6px; }
.pose svg { display: block; width: 100%; height: auto; aspect-ratio: 344 / 214; }
.pose figcaption { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 6px; line-height: 1.25; }
.s-k, .s-g, .s-r, .s-a, .s-ok, .s-bad, .s-halo, .s-q { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.s-k { stroke: var(--fig); } .s-g { stroke: var(--equip-line); } .s-r { stroke: var(--line); } .s-a { stroke: var(--acc); }
.s-ok { stroke: var(--good); } .s-bad { stroke: var(--bad); } .s-halo { stroke: var(--panel); } .s-q { stroke: var(--muted); }
.f-k { fill: var(--fig); } .f-a { fill: var(--acc); } .f-eq { fill: var(--equip); } .f-halo { fill: var(--panel); } .f-none { fill: none; }
.ex-head { display: flex; align-items: center; gap: 10px; margin: 12px 2px 8px; }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-family: var(--display); font-size: 17px; font-weight: 800; }
.card.done .num { background: var(--good); color: #fff; }
.ex-head h3 { font-size: 18px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 2px 8px; }
.pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--panel); white-space: nowrap; }
.pill.main { background: var(--acc); color: var(--on-acc); font-weight: 700; }
.cue { font-size: 15px; color: var(--muted); margin: 0 2px 12px; line-height: 1.45; }
.log { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; flex-wrap: wrap; }
.sets { display: flex; gap: 8px; flex: 1; }
.set { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-size: 19px; font-weight: 800; color: var(--muted); transition: background .15s, border-color .15s; }
.set[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.card.done .set[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.load { display: flex; align-items: center; gap: 6px; }
.load label { font-size: 13px; font-weight: 600; color: var(--muted); }
.load input { width: 74px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); text-align: center; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.load input:focus { outline: 2px solid var(--acc); outline-offset: 0; border-color: transparent; }
.load small { font-size: 14px; font-weight: 600; color: var(--muted); }

.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.rules h4 { grid-column: 1 / -1; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rules div { font-size: 14px; line-height: 1.35; }
.rules b { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--acc); margin-bottom: 1px; }
.reset { display: block; margin: 16px auto 0; font-size: 15px; font-weight: 600; color: var(--muted); padding: 10px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); }
.rest-day { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; font-size: 15px; color: var(--muted); }

/* meals */
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.meal-head { display: grid; gap: 1px; margin-bottom: 8px; }
.meal-head h3 { font-family: var(--display); font-size: 21px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
.meal-head span { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.meal ul { list-style: none; display: grid; gap: 3px; }
.meal li { font-size: 16px; }
.meal li b { font-weight: 700; }
.dish { font-size: 14px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.slot { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.slot:not(:first-child) { margin-top: 10px; }
.note { font-size: 14px; color: var(--muted); padding: 4px 4px 0; line-height: 1.45; }

/* shopping */
.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px 16px 4px; }
.grp h3 { font-family: var(--display); font-size: 21px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; padding: 8px 0 4px; }
.item { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); text-align: left; }
.item:first-of-type { border-top: 0; }
.box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--equip-line); display: grid; place-items: center; }
.box svg { width: 14px; height: 14px; opacity: 0; }
.item[aria-pressed="true"] .box { background: var(--good); border-color: var(--good); }
.item[aria-pressed="true"] .box svg { opacity: 1; }
.item[aria-pressed="true"] .iname, .item[aria-pressed="true"] .iq { color: var(--muted); text-decoration: line-through; }
.iname { font-size: 16px; font-weight: 500; }
.iname small { display: block; font-size: 13px; color: var(--muted); }
.iq { font-size: 16px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* rest timer */
.timer { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 76px); width: min(608px, calc(100% - 24px)); background: var(--ink); color: var(--bg); border-radius: 18px; padding: 10px 10px 10px 16px; display: none; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 5; overflow: hidden; }
.timer-on .timer { display: flex; }
.timer .lbl { font-size: 13px; font-weight: 600; opacity: .75; }
.timer .t { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.timer .grow { flex: 1; }
.timer button { font-size: 15px; font-weight: 700; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg); }
.timer .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--acc); }
.timer.go { background: var(--good); color: #fff; }
.timer.go button { color: #fff; background: rgba(255,255,255,.2); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px max(8px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 6px) max(8px, env(safe-area-inset-left)); z-index: 6; }
.tabs button { flex: 1; max-width: 180px; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"] svg { stroke-width: 2.4; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="app" id="view"></main>
<div class="timer" id="timer" role="timer" aria-live="polite">
  <div><div class="lbl" id="tlbl">Repos</div><div class="t" id="tval">2:00</div></div>
  <div class="grow"></div>
  <button type="button" id="tplus">+15 s</button>
  <button type="button" id="tskip">Passer</button>
  <div class="bar" id="tbar"></div>
</div>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="seances"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Séances</button>
  <button type="button" data-tab="repas"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2.5 1-4 3.5-4 7v3h4"/></svg>Repas</button>
  <button type="button" data-tab="courses"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.2"/><circle cx="17.5" cy="20" r="1.2"/></svg>Courses</button>
</nav>
<script>

"prot": 52, "html": "<ul><li><b>180 g</b> poulet</li><li><b>90 g</b> riz</li><li><b>200 g</b> légumes verts</li><li><b>1 c. à s.</b> huile d’olive</li></ul>"}, {"name": "Collation", "kcal": 320, "prot": 29, "html": "<ul><li><b>1 dose</b> whey</li><li><b>1</b> fruit</li><li><b>20 g</b> amandes</li></ul>"}, {"name": "Dîner", "kcal": 620, "prot": 44, "html": "<div class='dish'>Pâtes au thon</div><ul><li><b>90 g</b> pâtes</li><li><b>120 g</b> thon</li><li><b>150 g</b> sauce tomate</li><li>salade</li><li><b>1 c. à s.</b> huile d’olive</li></ul>"}, {"name": "Soir", "kcal": 120, "prot": 16, "html": "<ul><li><b>150 g</b> skyr</li><li><b>1 c. à c.</b> miel</li></ul>"}]}, {"day": "Samedi", "tag": "Haut 3", "kcal": 2290, "prot": 174, "meals": [{"name": "Petit-déjeuner", "kcal": 440, "prot": 30, "html": "<ul><li><b>200 g</b> skyr</li><li><b>50 g</b> flocons d’avoine</li><li><b>1</b> banane</li><li><b>1 c. à c.</b> miel</li></ul>"}, {"name": "Déjeuner", "kcal": 750, "prot": 34, "html": "<ul><li><b>2</b> filets de poisson</li><li><b>200 g</b> wedges</li><li>salade</li><li><b>1</b> tomate</li><li><b>1 c. à s.</b> huile d’olive</li></ul>"}, {"name": "Collation", "kcal": 350, "prot": 36, "html": "<ul><li><b>1 dose</b> whey</li><li><b>2 tranches</b> pain complet</li><li><b>1</b> œuf dur</li></ul>"}, {"name": "Dîner", "kcal": 660, "prot": 58, "html": "<ul><li><b>200 g</b> poulet</li><li><b>80 g</b> pâtes</li><li><b>120 g</b> sauce tomate</li><li>salade</li><li><b>1 c. à s.</b> huile d’olive</li></ul>"}, {"name": "Soir", "kcal": 90, "prot": 16, "html": "<ul><li><b>150 g</b> skyr</li></ul>"}]}, {"day": "Dimanche", "tag": "Repos", "kcal": 2110, "prot": 167, "meals": [{"name": "Petit-déjeuner", "kcal": 480, "prot": 26, "html": "<div class='dish'>Omelette à la tomate</div><ul><li><b>3</b> œufs</li><li><b>2 tranches</b> pain complet</li><li><b>1</b> tomate</li><li><b>1</b> fruit</li></ul>"}, {"name": "Déjeuner", "kcal": 600, "prot": 46, "html": "<ul><li><b>180 g</b> poulet</li><li><b>200 g</b> wedges</li><li>salade</li><li><b>1 c. à s.</b> huile d’olive</li></ul>"}, {"name": "Collation", "kcal": 410, "prot": 45, "html": "<div class='dish'>Skyr à la whey</div><ul><li><b>1 dose</b> whey</li><li><b>150 g</b> skyr</li><li><b>1</b> fruit</li><li><b>20 g</b> amandes</li></ul>"}, {"name": "Dîner", "kcal": 620, "prot": 49, "html": "<div class='dish'>Salade de riz au thon</div><ul><li><b>120 g</b> thon</li><li><b>2</b> œufs durs</li><li><b>60 g</b> riz</li><li><b>1</b> tomate</li><li>salade</li><li><b>1 c. à s.</b> huile d’olive</li></ul>"}]}], "shop": [{"g": "Protéines", "items": [{"n": "Escalopes de poulet halal", "q": "1,3 kg", "note": ""}, {"n": "Œufs", "q": "19", "note": "2 boîtes de 10"}, {"n": "Filets de poisson façon meunière", "q": "6", "note": ""}, {"n": "Thon au naturel", "q": "460 g", "note": "égoutté, 4 à 5 boîtes"}, {"n": "Skyr nature", "q": "1,65 kg", "note": "4 pots de 450 g"}, {"n": "Whey", "q": "7 doses", "note": ""}]}, {"g": "Féculents", "items": [{"n": "Wedges", "q": "1 kg", "note": ""}, {"n": "Pâtes", "q": "370 g", "note": ""}, {"n": "Riz", "q": "380 g", "note": ""}, {"n": "Flocons d’avoine", "q": "150 g", "note": ""}, {"n": "Pain complet", "q": "10 tranches", "note": ""}]}, {"g": "Fruits et légumes", "items": [{"n": "Bananes", "q": "5", "note": ""}, {"n": "Autres fruits", "q": "9", "note": "pommes, oranges, poires"}, {"n": "Tomates", "q": "7", "note": ""}, {"n": "Salade", "q": "2 sachets", "note": ""}, {"n": "Légumes verts surgelés", "q": "650 g", "note": "haricots verts, brocolis, courgettes"}]}, {"g": "Épicerie", "items": [{"n": "Sauce tomate", "q": "540 g", "note": ""}, {"n": "Amandes", "q": "100 g", "note": ""}, {"n": "Huile d’olive", "q": "14 c. à s.", "note": ""}, {"n": "Miel", "q": "5 c. à c.", "note": ""}]}]};
const KEY = 'muscu-app-v1';
let S = { tab: null, weights: {}, sessions: {}, shop: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const dow = new Date().getDay(); // 0 = dimanche
const FR = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
const view = document.getElementById('view');

function defaultTrainDay() {
  for (let k = 0; k < 7; k++) { const d = DATA.days.find(x => x.dow === (dow + k) % 7); if (d) return d.key; }
  return DATA.days[0].key;
}
let curTrain = defaultTrainDay();
let curMeal = FR[dow];
let tab = S.tab || 'seances';

function session(key) {
  const s = S.sessions[key];
  if (!s || s.date !== todayStr()) return { date: todayStr(), done: {} };
  return s;
}

function renderSeances() {
  const d = DATA.days.find(x => x.key === curTrain);
  const ses = session(d.key);
  const total = d.ex.reduce((a, e) => a + e.sets, 0);
  const done = d.ex.reduce((a, e) => a + (ses.done[e.slug] || []).filter(Boolean).length, 0);
  const C = 2 * Math.PI * 27, pct = total ? done / total : 0;
  const chips = DATA.days.map(x => `<button type="button" class="chip d-${x.key}" data-train="${x.key}" aria-pressed="${x.key === d.key}">${x.dow === dow ? '<i class="today" aria-label="aujourd’hui"></i>' : ''}<b>${x.day.slice(0, 3)}</b><span>${esc(x.name.split(' · ')[0].replace('Bas du corps', 'Bas'))}</span></button>`).join('');
  const cards = d.ex.map((e, i) => {
    const sv = DATA.svg[e.slug];
    const marks = ses.done[e.slug] || [];
    const isDone = marks.filter(Boolean).length === e.sets;
    const sets = Array.from({ length: e.sets }, (_, j) => `<button type="button" class="set" data-ex="${e.slug}" data-i="${j}" data-rest="${e.rest}" aria-pressed="${!!marks[j]}" aria-label="Série ${j + 1}">${j + 1}</button>`).join('');
    const load = e.load ? `<div class="load"><label for="w-${e.slug}">Charge</label><input id="w-${e.slug}" data-w="${e.slug}" inputmode="decimal" autocomplete="off" placeholder="–" value="${esc(S.weights[e.slug] || '')}"><small>kg</small></div>` : '';
    return `<article class="card${isDone ? ' done' : ''}">
      <div class="art"><figure class="pose">${sv.a}<figcaption>${esc(sv.ca)}</figcaption></figure><figure class="pose">${sv.b}<figcaption>${esc(sv.cb)}</figcaption></figure></div>
      <div class="ex-head"><span class="num">${isDone ? '✓' : i + 1}</span><h3>${esc(e.name)}</h3></div>
      <div class="pills"><span class="pill main">${e.sets} × ${esc(e.reps)}</span><span class="pill">${esc(e.start)}</span><span class="pill">Repos ${e.rest / 60} min</span></div>
      <p class="cue">${esc(e.cue)}</p>
      <div class="log"><div class="sets">${sets}</div>${load}</div>
    </article>`;
  }).join('');
  view.className = 'app d-' + d.key;
  view.innerHTML = `<div class="chips">${chips}</div>
    <section class="hero"><div class="hero-top"><div><h1>${d.day}</h1><h2>${esc(d.name)}</h2><p>${esc(d.sub)}</p></div>
      <div class="ring" aria-label="${done} séries sur ${total}"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" cx="32" cy="32" r="27" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg><div>${done}/${total}</div></div></div>
      <div class="hero-bar"><span>${d.ex.length} exercices</span><span>${d.dur}</span><span>${done === total ? 'Séance terminée' : 'Coche chaque série'}</span></div></section>
    <div class="list">${cards}</div>
    <section class="rules"><h4>Rappels</h4>
      <div><b>Échauffement</b>5 min de vélo + 1 série légère</div><div><b>Charge</b>Garde 2 répétitions en réserve</div>
      <div><b>Progression</b>Haut de la fourchette partout : charge + 1 cran</div><div><b>Tempo</b>1 s d’effort, 2 à 3 s au retour</div></section>
    <button type="button" class="reset" id="reset">Décocher toutes les séries</button>`;
}

function renderRepas() {
  const m = DATA.meals.find(x => x.day === curMeal);
  const short = { Lundi: 'Lun', Mardi: 'Mar', Mercredi: 'Mer', Jeudi: 'Jeu', Vendredi: 'Ven', Samedi: 'Sam', Dimanche: 'Dim' };
  const chips = DATA.meals.map(x => `<button type="button" class="chip d-${x.day.toLowerCase()}" data-meal="${x.day}" aria-pressed="${x.day === m.day}">${x.day === FR[dow] ? '<i class="today" aria-label="aujourd’hui"></i>' : ''}<b>${short[x.day]}</b><span>${x.tag}</span></button>`).join('');
  view.className = 'app d-' + m.day.toLowerCase();
  view.innerHTML = `<div class="chips">${chips}</div>
    <section class="hero"><div class="hero-top"><div><h1>${m.day}</h1><h2>Jour ${m.tag === 'Repos' ? 'de repos' : m.tag === 'Foot' ? 'de foot' : 'de muscu · ' + m.tag}</h2></div></div>
      <div class="hero-bar"><span>${m.kcal.toLocaleString('fr-FR')} kcal</span><span>${m.prot} g de protéines</span><span>${m.meals.length} repas</span></div></section>
    <div class="list">${m.meals.map(x => `<article class="meal"><div class="meal-head"><h3>${esc(x.name)}</h3><span>${x.kcal} kcal · ${x.prot} g prot.</span></div>${x.html}</article>`).join('')}
    <p class="note">Poulet, pâtes et riz pesés crus, thon égoutté. 1 c. à s. d’huile = 10 g. Wedges et poisson à l’air fryer, sans huile. Les jours de muscu, la collation se prend juste après la séance.</p></div>`;
}

function renderCourses() {
  const all = DATA.shop.flatMap(g => g.items.map(it => it.n));
  const left = all.filter(n => !S.shop[n]).length;
  const tick = '<svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  view.className = 'app d-food';
  view.innerHTML = `<section class="hero"><div class="hero-top"><div><h1>Courses</h1><h2>Pour 7 jours</h2></div></div>
      <div class="hero-bar"><span>${left === 0 ? 'Tout est pris' : left + ' article' + (left > 1 ? 's' : '') + ' à prendre'}</span></div></section>
    <div class="list">${DATA.shop.map(g => `<section class="grp"><h3>${esc(g.g)}</h3>${g.items.map(it => `<button type="button" class="item" data-shop="${esc(it.n)}" aria-pressed="${!!S.shop[it.n]}"><span class="box">${tick}</span><span class="iname">${esc(it.n)}${it.note ? `<small>${esc(it.note)}</small>` : ''}</span><span class="iq">${esc(it.q)}</span></button>`).join('')}</section>`).join('')}</div>
    <button type="button" class="reset" id="shopreset">Tout décocher</button>`;
}

function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  if (tab === 'repas') renderRepas(); else if (tab === 'courses') renderCourses(); else renderSeances();
}

/* rest timer */
let tEnd = 0, tLen = 0, tInt = null, tHide = null;
const tEl = document.getElementById('timer');
function startTimer(sec) {
  clearTimeout(tHide); tLen = sec; tEnd = Date.now() + sec * 1000;
  tEl.classList.remove('go'); document.body.classList.add('timer-on');
  tEl.className = 'timer ' + (view.className.match(/d-\w+/) || [''])[0];
  clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
}
function tick() {
  const ms = Math.max(0, tEnd - Date.now()), s = Math.ceil(ms / 1000);
  document.getElementById('tval').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  document.getElementById('tbar').style.width = (100 * (1 - ms / (tLen * 1000))) + '%';
  document.getElementById('tlbl').textContent = 'Repos';
  if (ms <= 0) {
    clearInterval(tInt); tEl.classList.add('go');
    document.getElementById('tlbl').textContent = 'C’est reparti';
    document.getElementById('tval').textContent = 'Série suivante';
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
    tHide = setTimeout(stopTimer, 6000);
  }
}
function stopTimer() { clearInterval(tInt); clearTimeout(tHide); document.body.classList.remove('timer-on'); }
document.getElementById('tplus').addEventListener('click', () => { if (tEl.classList.contains('go')) { startTimer(15); return; } tEnd += 15000; tLen += 15; tick(); });
document.getElementById('tskip').addEventListener('click', stopTimer);
document.addEventListener('visibilitychange', () => { if (!document.hidden && document.body.classList.contains('timer-on')) tick(); });

/* events */
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; S.tab = tab; save(); render(); window.scrollTo(0, 0);
});
view.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.train) { curTrain = t.dataset.train; render(); return; }
  if (t.dataset.meal) { curMeal = t.dataset.meal; render(); return; }
  if (t.dataset.ex) {
    const ses = session(curTrain), arr = ses.done[t.dataset.ex] || [];
    const i = +t.dataset.i; arr[i] = !arr[i]; ses.done[t.dataset.ex] = arr; S.sessions[curTrain] = ses; save();
    const y = window.scrollY; render(); window.scrollTo(0, y);
    if (arr[i]) startTimer(+t.dataset.rest);
    return;
  }
  if (t.id === 'reset') { delete S.sessions[curTrain]; save(); stopTimer(); render(); return; }
  if (t.dataset.shop) { S.shop[t.dataset.shop] = !S.shop[t.dataset.shop]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.id === 'shopreset') { S.shop = {}; save(); render(); }
});
view.addEventListener('input', e => {
  const w = e.target.dataset && e.target.dataset.w; if (!w) return;
  S.weights[w] = e.target.value.trim(); save();
});
render();
</script>
