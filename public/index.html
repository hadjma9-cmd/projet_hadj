<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2563EB">
<title>Mon programme muscu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen phone app: a scrolling view, then a fixed rest timer and a tab bar at the bottom. */
:root {
  --bg: #F3F4F6; --surface: #FFFFFF; --ink: #14171C; --muted: #5F6673; --line: #E2E5EA;
  --panel: #EEF0F4; --fig: #14171C; --equip: #DADEE5; --equip-line: #A6ADB9; --muscle: #D5D9E0;
  --good: #16A34A; --bad: #DC2626; --warn: #B45309; --on-acc: #FFFFFF; --acc: #2563EB;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
.d-lundi { --acc: #2563EB; } .d-mardi { --acc: #0D9488; } .d-vendredi { --acc: #EA580C; } .d-samedi { --acc: #7C3AED; }
.d-mercredi { --acc: #CA8A04; } .d-jeudi, .d-dimanche { --acc: #6B7280; } .d-ink { --acc: #14171C; } .d-coach { --acc: #0E7490; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0D0F12; --surface: #171A1F; --ink: #EEF0F3; --muted: #9AA1AD; --line: #2A2E36; --panel: #1E2228; --fig: #F1F3F6; --equip: #2C3139; --equip-line: #5F6774; --muscle: #343941; --good: #22C55E; --bad: #F05252; --warn: #F59E0B; color-scheme: dark; }
  :root:not([data-theme="light"]) .d-lundi { --acc: #5B8DEF; } :root:not([data-theme="light"]) .d-mardi { --acc: #2DB8AA; }
  :root:not([data-theme="light"]) .d-vendredi { --acc: #F07A3C; } :root:not([data-theme="light"]) .d-samedi { --acc: #A07CF4; }
  :root:not([data-theme="light"]) .d-mercredi { --acc: #E0A82E; } :root:not([data-theme="light"]) .d-jeudi, :root:not([data-theme="light"]) .d-dimanche { --acc: #8A919E; }
  :root:not([data-theme="light"]) .d-ink { --acc: #EEF0F3; --on-acc: #14171C; } :root:not([data-theme="light"]) .d-coach { --acc: #22B4CC; --on-acc: #0D0F12; }
}
:root[data-theme="dark"] { --bg: #0D0F12; --surface: #171A1F; --ink: #EEF0F3; --muted: #9AA1AD; --line: #2A2E36; --panel: #1E2228; --fig: #F1F3F6; --equip: #2C3139; --equip-line: #5F6774; --muscle: #343941; --good: #22C55E; --bad: #F05252; --warn: #F59E0B; color-scheme: dark; }
:root[data-theme="dark"] .d-lundi { --acc: #5B8DEF; } :root[data-theme="dark"] .d-mardi { --acc: #2DB8AA; }
:root[data-theme="dark"] .d-vendredi { --acc: #F07A3C; } :root[data-theme="dark"] .d-samedi { --acc: #A07CF4; }
:root[data-theme="dark"] .d-mercredi { --acc: #E0A82E; } :root[data-theme="dark"] .d-jeudi, :root[data-theme="dark"] .d-dimanche { --acc: #8A919E; }
:root[data-theme="dark"] .d-ink { --acc: #EEF0F3; --on-acc: #14171C; } :root[data-theme="dark"] .d-coach { --acc: #22B4CC; --on-acc: #0D0F12; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.app { min-height: 100%; padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 96px) max(16px, env(safe-area-inset-left)); max-width: 640px; margin: 0 auto; }
.timer-on .app { padding-bottom: calc(env(safe-area-inset-bottom) + 170px); }
.list { display: grid; gap: 12px; }
h2.sec { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; margin: 22px 2px 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h2.sec small { font-family: var(--body); font-size: 14px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.muted { color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 11px 16px; border-radius: 12px; background: var(--acc); color: var(--on-acc); }
.btn.ghost { background: var(--panel); color: var(--ink); }
.btn.small { font-size: 14px; padding: 8px 12px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.reset { display: block; margin: 16px auto 0; font-size: 15px; font-weight: 600; color: var(--muted); padding: 10px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); }

/* day chips */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 12px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips.c7 .chip { min-width: 0; padding: 7px 2px 6px; }
.chips.c7 .chip b { font-size: 16px; }
.chips.c7 .chip span { font-size: 11px; }
.chips.c7 .chip .today { top: 3px; right: 3px; width: 6px; height: 6px; }
.chip { flex: 1 1 0; min-width: 46px; border-radius: 12px; padding: 7px 6px 6px; background: var(--surface); border: 1px solid var(--line); text-align: center; position: relative; }
.chip b { display: block; font-family: var(--display); font-size: 18px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; line-height: 1.05; }
.chip span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.chip[aria-pressed="true"] span { color: var(--on-acc); opacity: .85; }
.chip .today { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
.chip[aria-pressed="true"] .today { background: var(--on-acc); }
.chip .ok { position: absolute; top: 3px; left: 5px; font-size: 11px; font-weight: 800; color: var(--good); }
.chip[aria-pressed="true"] .ok { color: var(--on-acc); }

/* hero */
.hero { background: var(--acc); color: var(--on-acc); border-radius: 20px; padding: 16px 18px; margin-bottom: 12px; }
.hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hero h1 { font-family: var(--display); font-size: 40px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; line-height: .95; }
.hero h2 { font-size: 18px; font-weight: 700; margin-top: 6px; text-wrap: balance; }
.hero p { font-size: 14px; font-weight: 500; opacity: .9; margin-top: 2px; }
.ring { flex: none; width: 64px; height: 64px; position: relative; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6; }
.ring .bg { stroke: currentColor; opacity: .25; }
.ring .fg { stroke: currentColor; stroke-linecap: round; transition: stroke-dashoffset .3s; }
.ring div { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hero-bar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.hero-bar span { font-size: 13px; font-weight: 600; background: color-mix(in srgb, var(--on-acc) 18%, transparent); border-radius: 99px; padding: 4px 10px; }
.bar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--on-acc) 25%, transparent); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--on-acc); border-radius: 99px; transition: width .3s; }
.meter { margin-top: 12px; font-size: 13px; font-weight: 600; }
.meter-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.water { display: flex; align-items: center; gap: 8px; }
.water button { font-weight: 800; width: 34px; height: 30px; border-radius: 9px; background: color-mix(in srgb, var(--on-acc) 22%, transparent); color: var(--on-acc); }

.note { font-size: 14px; color: var(--muted); line-height: 1.45; }
.banner { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--acc); border-radius: 14px; padding: 11px 14px; font-size: 14.5px; line-height: 1.4; margin-bottom: 12px; }
.banner b { font-weight: 700; }
details.warm { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; margin-bottom: 12px; }
details.warm summary { list-style: none; cursor: pointer; padding: 13px 0; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
details.warm summary::-webkit-details-marker { display: none; }
details.warm summary::after { content: "+"; font-family: var(--display); font-size: 24px; color: var(--muted); line-height: 1; }
details.warm[open] summary::after { content: "–"; }
details.warm ol { padding: 0 0 14px 20px; display: grid; gap: 4px; font-size: 15px; }

/* exercise card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; }
.card.done { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.seg { display: flex; background: var(--panel); border-radius: 11px; padding: 3px; gap: 3px; margin-bottom: 10px; }
.seg button { flex: 1; font-size: 13px; font-weight: 700; padding: 7px 4px; border-radius: 9px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.art { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pose { background: var(--panel); border-radius: 12px; padding: 4px 4px 6px; }
.pose svg { display: block; width: 100%; height: auto; aspect-ratio: 344 / 214; }
.pose figcaption { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 6px; line-height: 1.25; }
.s-k, .s-g, .s-r, .s-a, .s-ok, .s-bad, .s-halo, .s-q, .s-t { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.s-k { stroke: var(--fig); } .s-g { stroke: var(--equip-line); } .s-r { stroke: var(--line); } .s-a { stroke: var(--acc); }
.s-ok { stroke: var(--good); } .s-bad { stroke: var(--bad); } .s-halo, .s-t { stroke: var(--panel); } .s-q { stroke: var(--muted); }
.f-k { fill: var(--fig); } .f-a { fill: var(--acc); } .f-eq { fill: var(--equip); } .f-halo { fill: var(--panel); } .f-none { fill: none; }
.ex-head { display: flex; align-items: center; gap: 10px; margin: 12px 2px 8px; }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; font-family: var(--display); font-size: 17px; font-weight: 800; }
.card.done .num { background: var(--good); color: #fff; }
.ex-head h3 { font-size: 18px; font-weight: 700; line-height: 1.2; text-wrap: balance; flex: 1; }
.ex-head .open { font-size: 13px; font-weight: 700; color: var(--muted); padding: 6px 8px; border-radius: 8px; background: var(--panel); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 2px 10px; }
.pill { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--panel); white-space: nowrap; }
.pill.main { background: var(--acc); color: var(--on-acc); font-weight: 700; }
.muscles { display: flex; align-items: center; gap: 12px; margin: 0 2px 10px; padding: 8px 10px; background: var(--panel); border-radius: 12px; }
.mm { flex: none; width: 118px; height: auto; }
.mm .mb { fill: var(--muscle); } .mm .mp { fill: var(--acc); } .mm .ms { fill: var(--acc); fill-opacity: .38; }
.mm .sx { stroke: var(--panel); stroke-width: .8; fill: none; }
.muscles div { font-size: 14px; line-height: 1.35; }
.muscles b { font-weight: 700; }
.muscles span { color: var(--muted); }
.cue { font-size: 15px; color: var(--ink); margin: 0 2px 6px; line-height: 1.45; }
.err { font-size: 14px; color: var(--muted); margin: 0 2px 12px; line-height: 1.4; }
.err b { color: var(--bad); font-weight: 700; }
.last { font-size: 14px; margin: 0 2px 10px; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--acc) 10%, var(--surface)); line-height: 1.35; }
.last b { font-weight: 700; }
.log { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; flex-wrap: wrap; }
.sets { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
.set { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-size: 19px; font-weight: 800; color: var(--muted); transition: background .15s, border-color .15s; }
.set[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }
.card.done .set[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.load { display: flex; align-items: center; gap: 6px; }
.load label { font-size: 13px; font-weight: 600; color: var(--muted); }
.load input { width: 74px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); text-align: center; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.load small { font-size: 14px; font-weight: 600; color: var(--muted); }
.ask { margin-top: 12px; padding: 12px; border-radius: 12px; background: var(--panel); display: grid; gap: 10px; }
.ask p { font-size: 15px; font-weight: 600; }
.ask div { display: flex; gap: 8px; flex-wrap: wrap; }
.card.done.fold .art, .card.done.fold .muscles, .card.done.fold .cue, .card.done.fold .err, .card.done.fold .seg, .card.done.fold .pills, .card.done.fold .last { display: none; }
.card.done.fold .ex-head { margin-top: 2px; }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.rules div { font-size: 14px; line-height: 1.35; }
.rules b { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--acc); margin-bottom: 1px; }

/* meals */
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.meal.eaten { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.meal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.meal-head h3 { font-family: var(--display); font-size: 21px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; line-height: 1.05; }
.meal-head .tot { text-align: right; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.meal-head .tot b { display: block; font-size: 17px; color: var(--ink); font-weight: 700; }
.dish { font-size: 14px; font-weight: 700; color: var(--muted); margin: -4px 0 8px; }
.food { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; }
.food:first-of-type { border-top: 0; }
.food .fn { font-size: 15.5px; line-height: 1.3; }
.food .fn b { font-weight: 700; }
.food .fp { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.food .fk { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin-top: -2px; }
.new { display: inline-block; font-size: 11px; font-weight: 700; color: var(--warn); border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; margin-left: 4px; vertical-align: 2px; }
.eat { margin-top: 10px; width: 100%; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 15px; background: var(--panel); }
.eat[aria-pressed="true"] { background: var(--good); color: #fff; }
.fishsw { display: flex; gap: 6px; margin: 0 0 8px; }
.fishsw button { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: var(--panel); color: var(--muted); }
.fishsw button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* shopping */
.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px 16px 4px; }
.grp h3 { font-family: var(--display); font-size: 21px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; padding: 8px 0 4px; }
.item { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); text-align: left; }
.item:first-of-type { border-top: 0; }
.tick { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--equip-line); display: grid; place-items: center; }
.tick svg { width: 14px; height: 14px; opacity: 0; }
.item[aria-pressed="true"] .tick { background: var(--good); border-color: var(--good); }
.item[aria-pressed="true"] .tick svg { opacity: 1; }
.item[aria-pressed="true"] .iname, .item[aria-pressed="true"] .iq { color: var(--muted); text-decoration: line-through; }
.iname { font-size: 16px; font-weight: 500; }
.iname small { display: block; font-size: 13px; color: var(--muted); }
.iq { font-size: 16px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* coach */
.chat { display: grid; gap: 10px; margin-bottom: 12px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 15.5px; line-height: 1.45; }
.msg.user { justify-self: end; background: var(--acc); color: var(--on-acc); border-bottom-right-radius: 5px; white-space: pre-wrap; }
.msg.bot { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.msg.bot p + p, .msg.bot p + ul, .msg.bot ul + p, .msg.bot ol + p, .msg.bot p + ol { margin-top: 8px; }
.msg.bot ul, .msg.bot ol { padding-left: 20px; display: grid; gap: 3px; }
.msg.bot b { font-weight: 700; }
.msg.err { border-color: var(--bad); color: var(--bad); }
.dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 4px; animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 12px; padding: 2px 16px; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.composer { position: sticky; bottom: calc(env(safe-area-inset-bottom) + 72px); display: flex; gap: 8px; align-items: flex-end; background: var(--bg); padding: 8px 0 4px; }
.composer textarea { flex: 1; min-height: 46px; max-height: 140px; resize: none; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; font-size: 16px; line-height: 1.35; }
.composer .btn { height: 46px; }

/* suivi */
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat div { background: var(--panel); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; align-items: baseline; }
.row:first-child { border-top: 0; }
.row b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row span small { display: block; color: var(--muted); font-size: 13px; }
.form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.form label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.form input, .form select { height: 44px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); padding: 0 10px; font-size: 16px; width: 112px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .ln { fill: none; stroke: var(--acc); stroke-width: 2.5; }
.chart .ar { fill: var(--acc); fill-opacity: .12; }
.chart .gd { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--body); }
.chart .pt { fill: var(--acc); }
.switch { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.switch:first-child { border-top: 0; }
.switch input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--acc); }
.switch input[type="text"] { width: 150px; }

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const D = s => new Date(s + 'T12:00:00');
const TODAY = () => ymd(new Date());
const FR = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
const SHORT = { Lundi: 'Lun', Mardi: 'Mar', Mercredi: 'Mer', Jeudi: 'Jeu', Vendredi: 'Ven', Samedi: 'Sam', Dimanche: 'Dim' };
const fmtDate = s => { const d = D(s); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1); };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fr1 = n => (Math.round(n * 10) / 10).toLocaleString('fr-FR');
const fr0 = n => Math.round(n).toLocaleString('fr-FR');

function mondayOf(d) { const x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function defaultStart() { const d = new Date(); const i = (d.getDay() + 6) % 7; const m = mondayOf(d); if (i >= 4) m.setDate(m.getDate() + 7); return ymd(m); }
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }
const fishWeek = () => isoWeek(new Date()) % 2 === 0 ? 'A' : 'B';
const weekKey = () => ymd(mondayOf(new Date()));

/* ---------- state ---------- */
let S = { v: 2, start: null, tab: null, variant: {}, weights: {}, hist: {}, sessions: {}, log: [], food: {}, body: [], shop: {}, coach: { code: '', msgs: [] }, set: { beep: true, wake: true } };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const o = JSON.parse(raw); S = Object.assign(S, o); S.set = Object.assign({ beep: true, wake: true }, o.set || {}); S.coach = Object.assign({ code: '', msgs: [] }, o.coach || {}); }
  else { const old = localStorage.getItem(OLD); if (old) { const o = JSON.parse(old); for (const k in (o.weights || {})) if (DATA.ex[k] && o.weights[k]) S.weights[k] = o.weights[k]; } }
} catch (e) {}
if (!S.start) S.start = defaultStart();
{ const lim = ymd(new Date(Date.now() - 14 * 864e5)); for (const k in S.food) if (k < lim) delete S.food[k]; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
save();

function progWeek() { const d = Math.floor((D(TODAY()) - D(S.start)) / 864e5); return d < 0 ? 0 : Math.floor(d / 7) + 1; }
const learning = () => progWeek() <= 2;
const setsFor = sl => learning() ? Math.min(2, sl.sets) : sl.sets;

/* ---------- program helpers ---------- */
const EQ = { machine: 'Machine', halteres: 'Haltères', pdc: 'Sans matériel' };
const dayByKey = k => DATA.days.find(d => d.key === k);
function slotsOf(day) { const out = day.slots.map((s, i) => Object.assign({ id: 'm' + i }, s)); if (day.abs) DATA.abs.forEach((s, i) => out.push(Object.assign({ id: 'a' + i, isAbs: true }, s))); return out; }
const options = sl => [sl.main].concat(sl.alts);
const varIdx = sl => Math.min(S.variant[sl.main] || 0, sl.alts.length);
const curSlug = sl => options(sl)[varIdx(sl)];
function optLabels(sl) {
  const labs = sl.alts.map(a => EQ[DATA.ex[a].eq]);
  const dup = labs[0] === labs[1];
  return ['Principal'].concat(labs.map((l, i) => dup ? 'Variante ' + (i + 1) : (l === 'Haltères' && sl.isAbs ? 'Avec haltère' : l)));
}
const repsOf = (sl, slug) => DATA.ex[slug].reps || sl.reps;
const hasLoad = slug => DATA.ex[slug].eq !== 'pdc';
const loadUnit = slug => /Contrepoids/.test(DATA.ex[slug].start) ? 'kg de contrepoids' : 'kg';
const muscleText = arr => arr.map(k => DATA.muscles[k]).join(', ');

function session(dayKey) {
  let s = S.sessions[dayKey];
  if (!s || s.date !== TODAY()) s = { date: TODAY(), done: {}, top: {}, t0: 0, logged: false };
  return s;
}
function counts(day) { const ses = session(day.key); let done = 0, total = 0; slotsOf(day).forEach(sl => { total += setsFor(sl); done += (ses.done[sl.id] || []).slice(0, setsFor(sl)).filter(Boolean).length; }); return { done, total, ses }; }
function weekDone() { const wk = weekKey(); const set = new Set(); S.log.forEach(l => { if (ymd(mondayOf(D(l.d))) === wk && l.done >= Math.ceil(l.total / 2)) set.add(l.day); }); return set; }
function lastHist(slug) { const h = (S.hist[slug] || []).filter(x => x.d !== TODAY()); return h[h.length - 1] || null; }
function bestHist(slug) { return (S.hist[slug] || []).reduce((b, x) => (num(x.w) != null && (b == null || num(x.w) > b)) ? num(x.w) : b, null); }
function recordHist(slug, patch) {
  const h = S.hist[slug] || (S.hist[slug] = []);
  let e = h.find(x => x.d === TODAY());
  if (!e) { e = { d: TODAY() }; h.push(e); }
  Object.assign(e, patch);
  if (h.length > 60) h.splice(0, h.length - 60);
}

function defaultTrainDay() { const dow = new Date().getDay(); for (let k = 0; k < 7; k++) { const d = DATA.days.find(x => x.dow === (dow + k) % 7); if (d) return d.key; } return DATA.days[0].key; }
let curTrain = defaultTrainDay(), curMeal = FR[new Date().getDay()], fishView = null;
const VALID_TABS = ['seances', 'repas', 'coach', 'suivi', 'courses'];
let tab = VALID_TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : (S.tab || 'seances');
const open = new Set();

/* ---------- muscle map ---------- */
function mmap(prim, sec) {
  let s = "<svg class='mm' viewBox='0 0 124 114' aria-hidden='true'>";
  DATA.regions.forEach(([keys, el]) => {
    const c = keys.some(k => prim.includes(k)) ? 'mp' : keys.some(k => sec.includes(k)) ? 'ms' : 'mb';
    s += el.replace(/^<(\w+)/, `<$1 class='${c}'`);
  });
  return s + "<path class='sx' d='M30 31V51.6M25.4 37.6H34.6M25.4 44.4H34.6'/></svg>";
}

/* ---------- séances ---------- */
function exCard(sl, n, day) {
  const slug = curSlug(sl), e = DATA.ex[slug], ses = session(day.key);
  const nSets = setsFor(sl), marks = ses.done[sl.id] || [];
  const isDone = marks.slice(0, nSets).filter(Boolean).length === nSets;
  const fold = isDone && !open.has(day.key + sl.id);
  const labs = optLabels(sl), vi = varIdx(sl);
  const seg = `<div class="seg" role="group" aria-label="Choisir la variante">${labs.map((l, i) => `<button type="button" data-var="${sl.id}" data-i="${i}" aria-pressed="${i === vi}">${esc(l)}</button>`).join('')}</div>`;
  const last = lastHist(slug);
  let lastHtml = '';
  if (last && last.w) {
    const inc = e.inc || DATA.inc[e.eq];
    lastHtml = `<div class="last">Dernière fois (${fmtDate(last.d)}) : <b>${esc(last.w)} ${loadUnit(slug)}</b>${last.top === true ? ' · objectif atteint. ' + esc(inc.replace(/^.*\? /, '')) : last.top === false ? ' · garde la même charge et vise une répétition de plus.' : ''}</div>`;
  } else if (last && last.top === true && !hasLoad(slug)) {
    lastHtml = `<div class="last">Dernière fois (${fmtDate(last.d)}) : objectif atteint. ${esc((e.inc || DATA.inc.pdc).replace(/^.*\? /, ''))}</div>`;
  }
  const sets = Array.from({ length: nSets }, (_, j) => `<button type="button" class="set" data-set="${sl.id}" data-i="${j}" data-rest="${sl.rest}" aria-pressed="${!!marks[j]}" aria-label="Série ${j + 1}">${j + 1}</button>`).join('');
  const wv = S.weights[slug] != null ? S.weights[slug] : (last && last.w ? last.w : '');
  const load = hasLoad(slug) ? `<div class="load"><label for="w-${day.key}-${sl.id}">Charge</label><input id="w-${day.key}-${sl.id}" data-w="${slug}" inputmode="decimal" autocomplete="off" placeholder="–" value="${esc(wv)}"><small>kg</small></div>` : '';
  const askNow = isDone && ses.top[sl.id] === undefined;
  const topRep = String(repsOf(sl, slug)).match(/(\d+)\s*(s|par|$)/);
  const ask = askNow ? `<div class="ask"><p>${e.timed ? 'Tu as tenu le temps maximum à chaque série ?' : `Tu as fait ${topRep ? topRep[1] : 'le maximum de'} répétitions à chaque série ?`}</p><div><button type="button" class="btn small" data-top="${sl.id}" data-v="1">Oui, j’augmente la prochaine fois</button><button type="button" class="btn small ghost" data-top="${sl.id}" data-v="0">Pas encore</button></div></div>` : '';
  return `<article class="card${isDone ? ' done' : ''}${fold ? ' fold' : ''}">
    ${seg}
    <div class="art"><figure class="pose">${e.a}<figcaption>${esc(e.ca)}</figcaption></figure><figure class="pose">${e.b}<figcaption>${esc(e.cb)}</figcaption></figure></div>
    <div class="ex-head"><span class="num">${isDone ? '✓' : n}</span><h3>${esc(e.name)}</h3>${isDone ? `<button type="button" class="open" data-fold="${day.key + sl.id}">${fold ? 'Voir' : 'Réduire'}</button>` : ''}</div>
    <div class="pills"><span class="pill main">${nSets} × ${esc(repsOf(sl, slug))}</span>${last ? '' : `<span class="pill">Départ : ${esc(e.start)}</span>`}<span class="pill">Repos ${sl.rest >= 60 ? (sl.rest / 60).toLocaleString('fr-FR') + ' min' : sl.rest + ' s'}</span></div>
    <div class="muscles">${mmap(e.prim, e.sec)}<div><b>Travaille :</b> ${esc(muscleText(e.prim))}${e.sec.length ? `<br><span>Aussi : ${esc(muscleText(e.sec))}</span>` : ''}</div></div>
    <p class="cue">${esc(e.how)}</p>
    <p class="err"><b>À éviter :</b> ${esc(e.err)}</p>
    ${lastHtml}
    <div class="log"><div class="sets">${sets}</div>${load}</div>
    ${ask}
  </article>`;
}

function renderSeances() {
  const day = dayByKey(curTrain), { done, total, ses } = counts(day);
  const wd = weekDone(), dow = new Date().getDay(), pw = progWeek();
  const C = 2 * Math.PI * 27, pct = total ? done / total : 0;
  const chips = DATA.days.map(x => `<button type="button" class="chip d-${x.key}" data-train="${x.key}" aria-pressed="${x.key === day.key}">${x.dow === dow ? '<i class="today" aria-label="aujourd’hui"></i>' : ''}${wd.has(x.key) ? '<i class="ok" aria-label="fait cette semaine">✓</i>' : ''}<b>${SHORT[x.day]}</b><span>${esc(x.name.split(' · ')[0].replace('Bas du corps', 'Bas'))}</span></button>`).join('');
  const all = slotsOf(day);
  const main = all.filter(s => !s.isAbs), abs = all.filter(s => s.isAbs);
  let n = 0;
  const cards = main.map(sl => exCard(sl, ++n, day)).join('');
  const absCards = abs.map(sl => exCard(sl, ++n, day)).join('');
  const learn = pw === 0 ? `<div class="banner">Ton programme commence le <b>${fmtDate(S.start)}</b>. Les 2 premières semaines, fais <b>2 séries par exercice avec des charges légères</b> pour apprendre les gestes.</div>`
    : pw <= 2 ? `<div class="banner"><b>Semaine ${pw} · apprentissage :</b> 2 séries par exercice, charges légères. On passe à 3 séries en semaine 3.</div>` : '';
  const finished = done === total && total > 0;
  const warm = DATA.warmup[day.key === 'vendredi' ? 'bas' : 'haut'];
  view.className = 'app d-' + day.key;
  view.innerHTML = `<div class="chips">${chips}</div>
    <section class="hero"><div class="hero-top"><div><h1>${esc(day.day)}</h1><h2>${esc(day.name)}</h2><p>${esc(day.sub)}</p></div>
      <div class="ring" aria-label="${done} séries sur ${total}"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" cx="32" cy="32" r="27" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg><div>${done}/${total}</div></div></div>
      <div class="hero-bar"><span>${main.length + abs.length} exercices</span><span>${esc(day.dur)}</span><span>${pw > 0 ? 'Semaine ' + pw : 'Début le ' + fmtDate(S.start)}</span><span>${finished ? 'Séance terminée' : wd.size + '/4 cette semaine'}</span></div></section>
    ${learn}
    <details class="warm"><summary>Échauffement · 8 min</summary><ol>${warm.map(w => `<li>${esc(w)}</li>`).join('')}</ol></details>
    <div class="list">${cards}</div>
    ${abs.length ? `<h2 class="sec">Bloc abdos <small>3 exercices sans machine · environ 10 min</small></h2><div class="list">${absCards}</div>` : ''}
    <h2 class="sec">Rappels</h2>
    <section class="box rules">
      <div><b>Charge</b>Garde 2 répétitions en réserve à chaque série</div><div><b>Progression</b>Haut de la fourchette partout : un cran de plus</div>
      <div><b>Tempo</b>1 s d’effort, 2 à 3 s au retour</div><div><b>Respiration</b>Souffle pendant l’effort</div>
      <div><b>Pas de machine libre ?</b>Touche « Machine » ou « Haltères » sur l’exercice</div><div><b>Douleur articulaire</b>Arrête l’exercice et parle-en au coach</div></section>
    ${done > 0 && !finished && !ses.logged ? `<button type="button" class="reset" id="finish">Terminer la séance maintenant</button>` : ''}
    <button type="button" class="reset" id="reset">Décocher toutes les séries</button>`;
}

function maybeLog(day) {
  const { done, total, ses } = counts(day);
  if (ses.logged || done === 0) return false;
  if (done < total && !ses.forceEnd) return false;
  ses.logged = true;
  const min = ses.t0 ? Math.max(1, Math.round((Date.now() - ses.t0) / 60000)) : null;
  S.log = S.log.filter(l => !(l.d === TODAY() && l.day === day.key));
  S.log.push({ d: TODAY(), day: day.key, done, total, min });
  if (S.log.length > 300) S.log.splice(0, S.log.length - 300);
  S.sessions[day.key] = ses; save();
  toast(done === total ? `Séance terminée${min ? ' en ' + min + ' min' : ''}. Bien joué !` : 'Séance enregistrée.');
  return true;
}

/* ---------- repas ---------- */
const F = k => DATA.foods[k];
function kp(f, q) { const x = F(f); const m = x.per === 'g' ? q / 100 : q; return [x.kcal * m, x.p * m]; }
function qtyLabel(f, q) {
  const x = F(f);
  if (x.per === 'g') return `<b>${q} g</b> · ${esc(x.n)}`;
  if (x.unit) return `<b>${q} ${esc(x.unit)}${q > 1 && !/\./.test(x.unit) ? 's' : ''}</b> · ${esc(x.n)}`;
  return `<b>${q}</b> · ${esc(q > 1 && x.pl ? x.pl : x.n)}`;
}
function mealData(m, week) { return m.fish ? Object.assign({ name: m.name, fish: true }, m[week]) : m; }
function mealTotals(items) { let k = 0, p = 0; for (const f in items) { const [a, b] = kp(f, items[f]); k += a; p += b; } return [k, p]; }
function dayMeals(dayName, week) { return DATA.meals.find(x => x.day === dayName).meals.map(m => mealData(m, week)); }
function foodDay() { const t = TODAY(); if (!S.food[t]) S.food[t] = { eaten: {}, water: 0 }; return S.food[t]; }

function renderRepas() {
  const md = DATA.meals.find(x => x.day === curMeal), isToday = curMeal === FR[new Date().getDay()];
  const week = fishView || fishWeek();
  const meals = dayMeals(curMeal, week);
  let K = 0, P = 0, eK = 0, eP = 0;
  const fd = isToday ? foodDay() : null;
  const cards = meals.map((m, i) => {
    const [k, p] = mealTotals(m.items); K += k; P += p;
    const eaten = fd && fd.eaten[i];
    if (eaten) { eK += k; eP += p; }
    const rows = Object.keys(m.items).map(f => { const [a, b] = kp(f, m.items[f]); return `<div class="food"><span class="fn">${qtyLabel(f, m.items[f])}${F(f).new ? '<span class="new">nouveau</span>' : ''}</span><span class="fp">${b >= 1 ? fr0(b) + ' g' : '–'}</span><span class="fk">${fr0(a)} kcal${F(f).per === 'u' && F(f).w ? ' · ' + F(f).w * m.items[f] + ' g environ' : ''}</span></div>`; }).join('');
    const sw = m.fish ? `<div class="fishsw" role="group" aria-label="Semaine"><button type="button" data-fish="A" aria-pressed="${week === 'A'}">Semaine A · poisson</button><button type="button" data-fish="B" aria-pressed="${week === 'B'}">Semaine B · thon</button></div>` : '';
    return `<article class="meal${eaten ? ' eaten' : ''}"><div class="meal-head"><h3>${esc(m.name)}</h3><div class="tot"><b>${fr0(p)} g</b>protéines · ${fr0(k)} kcal</div></div>${sw}${m.title ? `<p class="dish">${esc(m.title)}</p>` : ''}${rows}${isToday ? `<button type="button" class="eat" data-eat="${i}" aria-pressed="${!!eaten}">${eaten ? 'Mangé ✓' : 'Marquer comme mangé'}</button>` : ''}</article>`;
  }).join('');
  const chips = DATA.meals.map(x => `<button type="button" class="chip d-${x.day.toLowerCase()}" data-meal="${x.day}" aria-pressed="${x.day === curMeal}">${x.day === FR[new Date().getDay()] ? '<i class="today" aria-label="aujourd’hui"></i>' : ''}<b>${SHORT[x.day]}</b><span>${x.tag}</span></button>`).join('');
  const meter = isToday ? `<div class="meter"><div class="meter-row"><span>Protéines mangées</span><span>${fr0(eP)} / ${fr0(P)} g</span></div><div class="bar"><i style="width:${Math.min(100, P ? eP / P * 100 : 0)}%"></i></div>
      <div class="meter-row" style="margin-top:10px"><span>Eau : ${fr1(fd.water * 0.25)} / 2,5 L</span><span class="water"><button type="button" data-water="-1" aria-label="Retirer un verre">−</button><button type="button" data-water="1" aria-label="Ajouter un verre">+</button></span></div><div class="bar"><i style="width:${Math.min(100, fd.water / 10 * 100)}%"></i></div></div>` : '';
  view.className = 'app d-' + curMeal.toLowerCase();
  view.innerHTML = `<div class="chips c7">${chips}</div>
    <section class="hero"><div class="hero-top"><div><h1>${esc(curMeal)}</h1><h2>${md.tag === 'Repos' ? 'Jour de repos' : md.tag === 'Foot' ? 'Jour de foot' : 'Jour de muscu · ' + md.tag}</h2></div></div>
      <div class="hero-bar"><span>${fr0(P)} g de protéines</span><span>${fr0(K)} kcal</span><span>Semaine ${week}</span></div>${meter}</section>
    <div class="list">${cards}
    <section class="box note"><b>Repères.</b> Objectif : environ 2 100 kcal et 160 g de protéines par jour (2 g par kg). Poulet, pâtes et riz pesés crus ; thon pesé égoutté. Wedges et poisson à l’air fryer, sans huile ajoutée.<br><br><b>Poisson : 2 fois par semaine</b>, dont un poisson gras (sardines), comme le recommande l’ANSES. Le thon, poisson prédateur plus chargé en mercure, est limité à 100 g une semaine sur deux, en alternance avec le poisson meunière.<br><br>Les aliments marqués <span class="new">nouveau</span> ne sont pas dans ta liste : dis au coach si tu veux les remplacer.</section></div>`;
}

/* ---------- courses ---------- */
const GROUPS = [['Protéines', ['poulet', 'oeuf', 'skyr', 'whey', 'meuniere', 'thon', 'sardines']], ['Féculents', ['pates', 'riz', 'wedges', 'avoine', 'pain']], ['Fruits et légumes', ['banane', 'fruit', 'tomate', 'salade', 'legumes']], ['Épicerie', ['sauce', 'amandes', 'huile', 'miel']]];
function buyText(f, q) {
  const r5 = x => Math.ceil(x / 50) * 50;
  switch (f) {
    case 'poulet': return [fr1(Math.ceil(q / 100) / 10) + ' kg', 'poids cru'];
    case 'oeuf': return [String(q), q > 12 ? 'boîtes de 6 ou 12' : ''];
    case 'skyr': return [fr1(q / 1000) + ' kg', Math.ceil(q / 450) + ' pots de 450 g'];
    case 'whey': return [q + ' doses', '30 g par dose'];
    case 'meuniere': return [q + ' filet' + (q > 1 ? 's' : ''), ''];
    case 'thon': return [q + ' g égoutté', '1 boîte de 140 g'];
    case 'sardines': return [q + ' g égouttés', '1 boîte'];
    case 'salade': return [q + ' bols', Math.ceil(q / 5) + ' sachets environ'];
    case 'huile': return [q + ' c. à soupe', ''];
    case 'miel': return [q + ' c. à café', ''];
    case 'pain': return [q + ' tranches', ''];
    case 'banane': case 'fruit': case 'tomate': return [String(q), ''];
    default: return [r5(q) + ' g', ''];
  }
}
function renderCourses() {
  const week = fishWeek(), wk = weekKey();
  if (!S.shop || S.shop.week !== wk) S.shop = { week: wk, checked: {} };
  const tot = {};
  DATA.meals.forEach(md => md.meals.forEach(m => { const it = mealData(m, week).items; for (const f in it) tot[f] = (tot[f] || 0) + it[f]; }));
  const tick = '<svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let left = 0;
  const groups = GROUPS.map(([g, list]) => {
    const rows = list.filter(f => tot[f]).map(f => { const [q, note] = buyText(f, tot[f]); const on = !!S.shop.checked[f]; if (!on) left++; return `<button type="button" class="item" data-shop="${f}" aria-pressed="${on}"><span class="tick">${tick}</span><span class="iname">${esc((tot[f] > 1 && F(f).pl ? F(f).pl : F(f).n).replace(/ \(.*\)$/, ''))}${F(f).new ? '<span class="new">nouveau</span>' : ''}${note ? `<small>${esc(note)}</small>` : ''}</span><span class="iq">${esc(q)}</span></button>`; }).join('');
    return `<section class="grp"><h3>${g}</h3>${rows}</section>`;
  }).join('');

    if (!ses.t0) ses.t0 = Date.now();
    const slug = curSlug(sl), nSets = setsFor(sl);
    if (arr.slice(0, nSets).filter(Boolean).length === nSets) { recordHist(slug, { w: hasLoad(slug) ? (S.weights[slug] || (lastHist(slug) || {}).w || '') : '' }); }
    S.sessions[day.key] = ses; save();
    const logged = maybeLog(day);
    rerender();
    if (arr[i] && !logged) startTimer(+d.rest);
    return;
  }
  if (d.top) {
    const day = dayByKey(curTrain), sl = slotsOf(day).find(s => s.id === d.top), ses = session(day.key);
    ses.top[sl.id] = d.v === '1'; S.sessions[day.key] = ses;
    recordHist(curSlug(sl), { top: d.v === '1' }); save(); rerender(); return;
  }
  if (d.fold) { open.has(d.fold) ? open.delete(d.fold) : open.add(d.fold); rerender(); return; }
  if (t.id === 'reset') { delete S.sessions[curTrain]; save(); stopTimer(); rerender(); return; }
  if (t.id === 'finish') { const day = dayByKey(curTrain), ses = session(day.key); ses.forceEnd = true; S.sessions[day.key] = ses; maybeLog(day); rerender(); return; }
  if (d.eat) { const fd = foodDay(); fd.eaten[d.eat] = !fd.eaten[d.eat]; save(); rerender(); return; }
  if (d.water) { const fd = foodDay(); fd.water = Math.max(0, Math.min(16, fd.water + +d.water)); save(); rerender(); return; }
  if (d.shop) { S.shop.checked[d.shop] = !S.shop.checked[d.shop]; save(); rerender(); return; }
  if (t.id === 'shopreset') { S.shop.checked = {}; save(); rerender(); return; }
  if (d.q) { askCoach(d.q); return; }
  if (t.id === 'newchat') { if (coachAbort) coachAbort.abort(); S.coach.msgs = []; save(); render(); return; }
  if (t.id === 'backup') { const txt = JSON.stringify(S); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Sauvegarde copiée : colle-la dans tes notes.'), () => { const ta = document.getElementById('restoretxt'); document.getElementById('restore').hidden = false; ta.value = txt; ta.select(); toast('Copie la sauvegarde affichée.'); }); return; }
  if (t.id === 'restoreopen') { const r = document.getElementById('restore'); r.hidden = !r.hidden; return; }
  if (t.id === 'restoredo') { try { const o = JSON.parse(document.getElementById('restoretxt').value); if (!o || o.v !== 2) throw 0; S = Object.assign(S, o); save(); toast('Sauvegarde restaurée.'); render(); } catch (err) { toast('Cette sauvegarde n’est pas valide.'); } return; }
  if (t.id === 'wipe') { if (t.dataset.armed) { try { localStorage.removeItem(KEY); } catch (e2) {} location.reload(); } else { t.dataset.armed = '1'; t.textContent = 'Touche encore pour tout effacer'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Tout effacer'; } }, 4000); } return; }
});
view.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.w) { const slug = el.dataset.w; S.weights[slug] = el.value.trim(); const h = S.hist[slug]; const e2 = h && h.find(x => x.d === TODAY()); if (e2) e2.w = S.weights[slug]; save(); return; }
  if (el.id === 'ask') { el.style.height = 'auto'; el.style.height = Math.min(140, el.scrollHeight) + 'px'; }
});
view.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'start' && el.value) { S.start = el.value; save(); rerender(); }
  if (el.id === 'beep') { S.set.beep = el.checked; save(); }
  if (el.id === 'wake') { S.set.wake = el.checked; save(); }
  if (el.id === 'ccode') { S.coach.code = el.value.trim(); save(); toast('Code enregistré.'); }
});
view.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'composer') { const ta = document.getElementById('ask'); const v = ta.value; ta.value = ''; askCoach(v); }
  if (e.target.id === 'bodyform') {
    const kg = num(document.getElementById('kg').value), waist = num(document.getElementById('waist').value);
    if (kg == null || kg < 30 || kg > 250) { toast('Entre ton poids en kg, par exemple 81,6.'); return; }
    S.body = S.body.filter(b => b.d !== TODAY()); S.body.push(Object.assign({ d: TODAY(), kg }, waist ? { waist } : {}));
    S.body.sort((a, b) => a.d.localeCompare(b.d)); save(); toast('Poids enregistré.'); rerender();
  }
});
view.addEventListener('keydown', e => { if (e.target.id === 'ask' && e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) { e.preventDefault(); document.getElementById('composer').requestSubmit(); } });

render();
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
