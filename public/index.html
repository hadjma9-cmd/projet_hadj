<!DOCTYPE html>

<head>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<script>
try { var t = (JSON.parse(localStorage.getItem('n10-v3') || '{}').set || {}).theme || 'auto';
  if (t === 'auto') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Big Shoulders Display';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
:root{
  --bg:#0A0D13;--bg2:#10141D;--card:#151A25;--card2:#1C2230;--card3:#242C3D;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --tx:#F3F5F9;--tx2:#A2ABBA;--tx3:#687183;--ink:#EEF1F6;--eq:#2A3244;--eq2:#3A4458;--halo:#0A0D13;
  --acc:#FF5A1F;--acc2:#F0386B;--grad:linear-gradient(135deg,#FF5A1F 0%,#F0386B 100%);--gold:#FFC53D;--ok:#22C55E;--bad:#F43F5E;--warn:#F59E0B;
  --field:#0E2418;--fieldline:#1F4630;--cone:#FF7A1A;--ball:#F7F7F7;--run:#5B8CFF;--drib:#FF4F7E;
  --r:22px;--r2:16px;--nav:76px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --f-d:'Big Shoulders Display','Barlow Condensed','Arial Narrow',sans-serif;--f-c:'Barlow Condensed','Arial Narrow',sans-serif;--f-b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#F2F3F6;--bg2:#E8EAEF;--card:#FFFFFF;--card2:#F5F6F9;--card3:#ECEEF3;--line:rgba(12,20,40,.08);--line2:rgba(12,20,40,.14);
  --tx:#0C111B;--tx2:#4A5468;--tx3:#8892A4;--ink:#10151F;--eq:#D9DDE5;--eq2:#C3C9D4;--halo:#FFFFFF;
  --field:#E2F1E4;--fieldline:#B9D9BF;--ball:#FFFFFF;--run:#2563EB;--drib:#E0306B;
  color-scheme:light;
}
.c-hautA{--c1:#3B6CFF;--c2:#1F3FBF}.c-bas{--c1:#FF8A1F;--c2:#D9480F}.c-foot{--c1:#22A355;--c2:#13703A}.c-recup{--c1:#14B8A6;--c2:#0B7F75}
.c-vitesse{--c1:#F0386B;--c2:#B81B4A}.c-hautB{--c1:#8B5CF6;--c2:#5B2FD1}.c-match{--c1:#F2A516;--c2:#B86A00}.c-tech{--c1:#0EA5C6;--c2:#0B6E8A}
.c-brand{--c1:#FF5A1F;--c2:#F0386B}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--f-b);min-height:100vh;overscroll-behavior-y:none}
body::before{content:'';position:fixed;inset:0 0 auto 0;height:360px;background:radial-gradient(120% 70% at 50% -10%,rgba(255,90,31,.16),transparent 70%);pointer-events:none;z-index:0}
:root[data-theme=light] body::before{background:radial-gradient(120% 70% at 50% -10%,rgba(255,90,31,.10),transparent 70%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,p{margin:0}
a{color:var(--acc)}
svg{display:block}
.hide{display:none!important}

/* ---------------- layout ---------------- */
#view{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--nav) + var(--safe-b) + 28px)}
.page-h{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
.page-h h1{font:900 34px/1 var(--f-d);letter-spacing:.5px;text-transform:uppercase;flex:1}
.page-h .sub{font:600 14px var(--f-c);color:var(--tx2);text-transform:uppercase;letter-spacing:1px}
.ico-btn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ico-btn svg{width:22px;height:22px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 12px}
.sec-t h2{font:800 22px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.6px}
.sec-t small,.sec-t button{font:600 14px var(--f-c);color:var(--tx2);text-transform:uppercase;letter-spacing:.6px}
.sec-t button{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:12px}
.muted{color:var(--tx2)}.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* ---------------- buttons ---------------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border-radius:var(--r2);background:var(--grad);color:#fff;
  font:700 19px/1 var(--f-c);text-transform:uppercase;letter-spacing:1.2px;box-shadow:0 10px 24px -10px rgba(240,56,107,.7);width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px;fill:currentColor}
.btn.white{background:#fff;color:#0B0E14;box-shadow:0 12px 26px -12px rgba(0,0,0,.6)}
.btn.ghost{background:var(--card2);color:var(--tx);box-shadow:none;border:1px solid var(--line2)}
.btn.ok{background:linear-gradient(135deg,#22C55E,#15803D);box-shadow:0 10px 24px -10px rgba(34,197,94,.6)}
.btn.sm{min-height:44px;font-size:16px;padding:0 16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--acc);font-weight:600;text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:600 15px var(--f-c);letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;font:700 15px var(--f-c);letter-spacing:.5px;text-transform:uppercase;color:var(--tx2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.25)}
:root[data-theme=light] .seg button[aria-pressed=true]{box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* ---------------- home ---------------- */
.hello{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.avatar{width:46px;height:46px;border-radius:15px;background:var(--grad);display:grid;place-items:center;font:900 22px/1 var(--f-d);color:#fff;flex:none;box-shadow:0 8px 18px -8px rgba(240,56,107,.8)}
.hello h1{font:800 24px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.4px}
.hello p{font:600 13px var(--f-c);color:var(--tx2);text-transform:uppercase;letter-spacing:1px}
.lvl{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.lvl b{font:800 18px/1 var(--f-d);text-transform:uppercase;letter-spacing:.4px}
.lvl .bar{flex:1}
.lvl small{font:600 13px var(--f-c);color:var(--tx2);white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--grad);transition:width .5s}
.bar.gold i{background:linear-gradient(90deg,#FFC53D,#FF8A1F)}
.bar.ok i{background:linear-gradient(90deg,#22C55E,#14B8A6)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));
  box-shadow:0 22px 40px -24px var(--c1)}
.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 22px);pointer-events:none}
.hero::after{content:attr(data-big);position:absolute;right:-6px;bottom:-34px;font:900 170px/1 var(--f-d);color:rgba(255,255,255,.10);pointer-events:none;letter-spacing:-4px}
.hero>*{position:relative;z-index:1}
.hero .kick{font:700 13px var(--f-c);letter-spacing:1.6px;text-transform:uppercase;opacity:.85}
.hero h2{font:900 40px/.95 var(--f-d);text-transform:uppercase;letter-spacing:.3px;margin:8px 0 6px}
.hero .theme{font:600 16px/1.3 var(--f-b);opacity:.92}
.hero .tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
.hero .tag{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:6px 11px;font:700 13px/1 var(--f-c);letter-spacing:.6px;text-transform:uppercase}
.hero .done{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;font:600 15px var(--f-b)}
.hero .done svg{width:26px;height:26px;flex:none}
.hero .nxt{margin-top:12px;font:600 14px var(--f-b);opacity:.92}
.hero .nxt b{font-weight:700}
.hero .alt{display:block;text-align:center;margin-top:12px;font:700 14px var(--f-c);letter-spacing:.8px;text-transform:uppercase;color:#fff;opacity:.9}
.tip{display:flex;gap:12px;align-items:flex-start}
.tip .ti{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;background:rgba(255,90,31,.14)}
.tip .ti svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip b{display:block;font:700 16px/1.25 var(--f-b);margin-bottom:2px}
.tip p{color:var(--tx2);font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 10px;border-radius:14px;background:var(--card2);border:1px solid transparent;min-height:72px}
.wd small{font:700 12px var(--f-c);color:var(--tx3);letter-spacing:.6px}
.wd i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card3);font:800 12px var(--f-c);color:var(--tx2);font-style:normal}
.wd i svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wd.on i{background:linear-gradient(140deg,var(--c1),var(--c2));color:#fff}
.wd.today{border-color:var(--tx);background:var(--card)}
.wd.miss i{opacity:.45}
.wd span{font:600 11px var(--f-c);color:var(--tx3);text-transform:uppercase;letter-spacing:.3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.goal{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:var(--card3)}.ring .fg{stroke:url(#gradRing);transition:stroke-dashoffset .6s}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font:900 24px/1 var(--f-d)}
.ring div small{display:block;font:600 11px var(--f-c);color:var(--tx2);text-align:center;letter-spacing:.5px}
.goal h3{font:800 20px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.4px}
.goal p{color:var(--tx2);font-size:14.5px;margin-top:3px}
.flame{display:inline-flex;align-items:center;gap:4px;font:800 15px var(--f-c);color:var(--gold)}
.qa{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qa h3{font:700 17px var(--f-b)}
.qa p{color:var(--tx2);font-size:14px}
.seg.sm{width:150px;flex:none}
.seg.sm button{min-height:36px;font-size:14px}
.nut{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nut .lab{display:flex;justify-content:space-between;font:600 14px var(--f-c);color:var(--tx2);letter-spacing:.3px;margin-bottom:6px;text-transform:uppercase}
.nut .lab b{color:var(--tx);font-weight:700}
.water{display:flex;gap:8px;margin-top:10px}
.water button{flex:1;min-height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font:700 15px var(--f-c);letter-spacing:.4px}
.cycle{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:12px 0 8px}
.cycle i{height:26px;border-radius:6px;background:var(--card3);position:relative;display:grid;place-items:center;font:700 11px var(--f-c);color:var(--tx3);font-style:normal}
.cycle i.b1{--bc:#22A355}.cycle i.b2{--bc:#FF8A1F}.cycle i.b3{--bc:#F0386B}
.cycle i.past{background:var(--bc);color:#fff;opacity:.55}
.cycle i.now{background:var(--bc);color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--bc)}
.cycle i.dl::before{content:'';position:absolute;top:-5px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--tx2);border:2px solid var(--card)}
.cycle i.ts::after{content:'';position:absolute;bottom:-5px;left:50%;margin-left:-4px;width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--gold);border:2px solid var(--card)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:600 13px var(--f-c);color:var(--tx2);letter-spacing:.3px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------------- programme ---------------- */
.dchips .chip{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;min-height:56px;padding:6px 14px;border-radius:16px}
.dchips .chip b{font:800 15px var(--f-c);letter-spacing:.6px;text-transform:uppercase}
.dchips .chip span{font:600 12.5px var(--f-c);color:var(--tx2);letter-spacing:.3px}
.dchips .chip[aria-pressed=true]{background:linear-gradient(140deg,var(--c1),var(--c2));color:#fff;border-color:transparent}
.dchips .chip[aria-pressed=true] span{color:rgba(255,255,255,.85)}
.dchips .chip .dot{position:absolute}
.exl{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.exi{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.exi>button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;text-align:left}
.thumb{width:76px;height:56px;border-radius:12px;background:var(--card2);flex:none;overflow:hidden;display:grid;place-items:center}
.thumb svg{width:100%;height:100%}
.exi h3{font:700 16.5px/1.2 var(--f-b)}
.exi .ps{font:600 14px var(--f-c);color:var(--tx2);letter-spacing:.3px;margin-top:3px}
.exi .ps b{color:var(--tx)}
.kind{display:inline-block;font:700 11px/1 var(--f-c);letter-spacing:.8px;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--card3);color:var(--tx2);margin-bottom:5px}
.kind.k-force{background:rgba(59,108,255,.16);color:#7FA0FF}.kind.k-power{background:rgba(255,90,31,.16);color:#FF8A5C}
.kind.k-core{background:rgba(139,92,246,.18);color:#B59BFF}.kind.k-plyo{background:rgba(240,56,107,.16);color:#FF7A9E}
.kind.k-sprint{background:rgba(240,56,107,.16);color:#FF7A9E}.kind.k-cod{background:rgba(245,158,11,.16);color:#FBBF4C}
.kind.k-ball{background:rgba(14,165,198,.16);color:#4FD1EE}.kind.k-prev{background:rgba(20,184,166,.16);color:#3EDBC8}
:root[data-theme=light] .kind.k-force{color:#2B55E0}:root[data-theme=light] .kind.k-power{color:#D9480F}:root[data-theme=light] .kind.k-core{color:#6D3FE0}
:root[data-theme=light] .kind.k-plyo,:root[data-theme=light] .kind.k-sprint{color:#C8184E}:root[data-theme=light] .kind.k-cod{color:#B45309}
:root[data-theme=light] .kind.k-ball{color:#0B7A96}:root[data-theme=light] .kind.k-prev{color:#0B7F75}
.chev{width:20px;height:20px;stroke:var(--tx3);fill:none;stroke-width:2.2;flex:none;transition:transform .2s}
.exi.open .chev{transform:rotate(90deg)}
.exd{padding:0 14px 16px}
.art{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pose{margin:0;background:var(--card2);border-radius:14px;overflow:hidden}
.pose figcaption{font:600 13px/1.25 var(--f-c);color:var(--tx2);padding:0 10px 9px;letter-spacing:.2px}
.pose svg{width:100%;height:auto}
.diafig{margin:0;border-radius:14px;overflow:hidden}
.diafig svg{width:100%;height:auto}
.how{margin-top:12px;font-size:15.5px;line-height:1.5}
.err{margin-top:8px;font-size:14.5px;color:var(--tx2)}
.err b{color:var(--bad)}
.mus{display:flex;gap:12px;align-items:center;margin-top:12px;background:var(--card2);border-radius:14px;padding:10px 12px}
.mus .mm{width:112px;flex:none}
.mus p{font-size:14px;color:var(--tx2)}.mus p b{color:var(--tx)}
.quals{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.quals span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font:600 13px var(--f-c);letter-spacing:.3px}
.alts{margin-top:12px;font-size:14px;color:var(--tx2)}
.box-note{background:var(--card2);border:1px dashed var(--line2);border-radius:16px;padding:12px 14px;font-size:14.5px;color:var(--tx2);margin-top:12px}
.box-note b{color:var(--tx)}
.checks{display:flex;flex-direction:column;gap:8px}
.ck{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.ck .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;margin-top:1px}
.ck .bx svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck[aria-pressed=true] .bx{background:var(--ok);border-color:var(--ok)}
.ck[aria-pressed=true] .bx svg{opacity:1}
.ck[aria-pressed=true] .ct{color:var(--tx2);text-decoration:line-through;text-decoration-color:var(--tx3)}
.ck .ct{font-size:15.5px;line-height:1.35}
.ck ul{margin:6px 0 0;padding-left:18px;color:var(--tx2);font-size:14px}
.plan12{display:flex;flex-direction:column;gap:10px}

/* ---------------- workout overlay ---------------- */

.wo-h{font:900 32px/1 var(--f-d);text-transform:uppercase;letter-spacing:.3px;margin:6px 0 4px}
.wo-sub{color:var(--tx2);font-size:15px}
.big-q{font:800 22px/1.15 var(--f-d);text-transform:uppercase;letter-spacing:.4px;margin:22px 0 10px}
.opts{display:flex;flex-direction:column;gap:8px}

.big-q.sm{font-size:19px;margin:18px 0 8px}
.btn.txt{background:none;box-shadow:none;color:var(--tx2);width:auto;padding:0 16px;flex:none}
.opt{min-height:54px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:left;padding:0 16px;font:600 16px var(--f-b);display:flex;align-items:center;gap:12px}
.opt i{width:12px;height:12px;border-radius:50%;flex:none;font-style:normal}
.opt[aria-pressed=true]{border-color:var(--tx);background:var(--card2)}
.light{display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;margin-top:18px;background:var(--card);border:1px solid var(--line)}

.exnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}

.vsw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px}

.presc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}

.presc small{font:600 11.5px var(--f-c);color:var(--tx2);text-transform:uppercase;letter-spacing:.6px}

.lastline{margin-top:12px;background:var(--card2);border-radius:14px;padding:10px 12px;font-size:14.5px;color:var(--tx2)}

.dots{display:flex;gap:8px;justify-content:center;margin:18px 0 6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--card3);font-style:normal}
.dots i.on{background:linear-gradient(140deg,var(--c1),var(--c2))}
.dots i.cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c1)}
.setlab{text-align:center;font:900 26px/1 var(--f-d);text-transform:uppercase;letter-spacing:.4px;margin:6px 0 12px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 8px 12px;text-align:center}
.stp label{display:block;font:700 12px var(--f-c);letter-spacing:1px;color:var(--tx2);text-transform:uppercase;margin-bottom:6px}
.stp .ctl{display:flex;align-items:center;justify-content:space-between;gap:4px}
.stp button{width:44px;height:44px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font:700 24px/1 var(--f-c);flex:none}
.stp input{width:100%;min-width:0;background:none;border:0;text-align:center;font:900 32px/1 var(--f-d);letter-spacing:.3px;padding:0;-moz-appearance:textfield}
.stp input::placeholder{color:var(--tx3)}
.stp small{display:block;font:600 12px var(--f-c);color:var(--tx3);margin-top:4px;text-transform:uppercase;letter-spacing:.6px}
.stp.one{grid-column:1/-1}
.wo-main{margin-top:14px}
.fb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.fb button{min-height:64px;border-radius:16px;background:var(--card);border:1px solid var(--line);font:700 15px var(--f-c);letter-spacing:.4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fb button span{font-size:22px;line-height:1}
.fb button[aria-pressed=true]{border-color:var(--tx);background:var(--card2)}
.fold{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.fold summary{list-style:none;cursor:pointer;padding:14px 16px;font:700 15px var(--f-c);letter-spacing:.8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold[open] summary .chev{transform:rotate(90deg)}
.fold>div{padding:0 16px 16px}
.wo-foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(var(--safe-b) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.wo-foot>div{max-width:528px;margin:0 auto;display:flex;gap:10px}
.wo-foot .btn{flex:1}
.wo-foot .nb{width:56px;flex:none;min-height:54px;border-radius:var(--r2);background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.wo-foot .nb svg{width:22px;height:22px;stroke:var(--tx);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sum-hero{text-align:center;padding:26px 10px 8px}
.trophy{width:96px;height:96px;margin:0 auto 12px;border-radius:30px;background:var(--grad);display:grid;place-items:center;box-shadow:0 18px 40px -16px rgba(240,56,107,.9)}
.trophy svg{width:52px;height:52px;fill:#fff}
.sum-hero h2{font:900 38px/1 var(--f-d);text-transform:uppercase;letter-spacing:.4px}
.sum-hero p{color:var(--tx2);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stats b{display:block;font:900 26px/1.05 var(--f-d)}
.stats small{font:600 12px var(--f-c);color:var(--tx2);text-transform:uppercase;letter-spacing:.6px}
.xpl{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.xpl div{display:flex;justify-content:space-between;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.xpl b{color:var(--gold);font:800 17px var(--f-c);letter-spacing:.4px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.rpe button{min-height:46px;border-radius:12px;background:var(--card);border:1px solid var(--line);font:800 18px var(--f-d)}
.rpe button[aria-pressed=true]{background:var(--grad);color:#fff;border-color:transparent}
.rpe-l{display:flex;justify-content:space-between;font:600 12px var(--f-c);color:var(--tx3);margin-top:6px;letter-spacing:.4px;text-transform:uppercase}
.tests{display:flex;flex-direction:column;gap:10px}
.tst{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tst label{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 16px var(--f-b)}
.tst input{width:110px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font:800 20px var(--f-d);text-align:right}
.tst p{color:var(--tx2);font-size:13.5px;margin-top:4px}
.stepper-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stepper-row b{font:700 16px var(--f-b)}
.mini-stp{display:flex;align-items:center;gap:10px}
.mini-stp button{width:42px;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font:700 22px/1 var(--f-c)}
.mini-stp output{min-width:30px;text-align:center;font:900 24px var(--f-d)}
.gchips{display:flex;flex-wrap:wrap;gap:8px}
.gchips button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font:700 15px var(--f-c);letter-spacing:.4px}
.gchips button[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}

/* ---------------- timer sheet ---------------- */
#timer{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(calc(100% + 120px));visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s linear .28s;pointer-events:none}
body.timer-on #timer{transform:none;visibility:visible;pointer-events:auto;transition:transform .28s cubic-bezier(.2,.9,.3,1)}
#timer>div{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;padding:16px 18px calc(var(--safe-b) + 16px);box-shadow:0 -20px 40px -20px rgba(0,0,0,.6)}
.tm-top{display:flex;align-items:center;gap:14px}
.tm-ring{position:relative;width:96px;height:96px;flex:none}
.tm-ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.tm-ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.tm-ring .bg{stroke:var(--card3)}.tm-ring .fg{stroke:url(#gradRing)}
.tm-ring b{position:absolute;inset:0;display:grid;place-items:center;font:900 30px/1 var(--f-d);font-variant-numeric:tabular-nums}
.tm-txt{flex:1}
.tm-txt small{font:700 13px var(--f-c);letter-spacing:1.3px;text-transform:uppercase;color:var(--tx2)}
.tm-txt p{font:800 20px/1.15 var(--f-d);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.tm-btns{display:flex;gap:8px;margin-top:14px}
.tm-btns button{flex:1;min-height:48px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font:700 16px var(--f-c);letter-spacing:.6px;text-transform:uppercase}
body.wo-on #timer{bottom:calc(var(--safe-b) + 80px)}
body.wo-on #timer>div{margin:0 12px;border-radius:24px;border-bottom:1px solid var(--line2);padding:12px 14px 12px;box-shadow:0 18px 40px -12px rgba(0,0,0,.65)}
body.wo-on .tm-ring,body.wo-on .tm-ring svg{width:76px;height:76px}
body.wo-on .tm-ring b{font-size:24px}
body.wo-on .tm-btns{margin-top:10px}
body.wo-on .tm-btns button{min-height:42px}
body.timer-on .wo-in{padding-bottom:calc(var(--safe-b) + 300px)}
#timer.go .tm-ring .fg{stroke:var(--ok)}
#timer.go .tm-txt p{color:var(--ok)}

/* ---------------- sheet (settings, dialogs) ---------------- */
#sheet{position:fixed;inset:0;z-index:70;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg2);border-radius:26px 26px 0 0;padding:10px 16px calc(var(--safe-b) + 20px);max-width:560px;margin:0 auto}
.sheet-x{position:absolute;right:14px;top:14px}

#sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 12px}
#sheet h2{font:900 28px/1 var(--f-d);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:600;font-size:15.5px}
.field small{display:block;color:var(--tx2);font-size:13px;font-weight:400}
.field input[type=text],.field input[type=date],.field input[type=password]{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;max-width:170px;font-size:15px}
.tog{position:relative;width:52px;height:32px;flex:none}
.tog input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.tog span{position:absolute;inset:0;border-radius:99px;background:var(--card3);transition:background .2s}
.tog span::after{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tog input:checked+span{background:var(--ok)}
.tog input:checked+span::after{transform:translateX(20px)}
textarea.backup{width:100%;min-height:110px;margin-top:10px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
.danger{color:var(--bad);font:700 15px var(--f-c);letter-spacing:.6px;text-transform:uppercase;padding:14px 0;display:block;width:100%;text-align:center}

/* ---------------- repas ---------------- */
.meal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px}
.meal+.meal{margin-top:10px}
.meal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.meal-h h3{font:800 18px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.4px}
.meal-h .dish{color:var(--tx2);font-size:14.5px;margin-top:3px}
.meal-h .tot{text-align:right;font:600 13px var(--f-c);color:var(--tx2);white-space:nowrap;letter-spacing:.3px}
.meal-h .tot b{display:block;font:800 20px/1 var(--f-d);color:var(--tx)}
.food{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}

.food .fp{color:var(--tx2);font:600 14px var(--f-c);white-space:nowrap;letter-spacing:.3px}
.new{display:inline-block;margin-left:6px;font:700 10.5px/1 var(--f-c);letter-spacing:.6px;text-transform:uppercase;padding:3px 6px;border-radius:5px;background:rgba(255,197,61,.16);color:var(--gold);vertical-align:2px}
.eat{margin-top:10px;width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line2);font:700 15px var(--f-c);letter-spacing:.6px;text-transform:uppercase;color:var(--tx2)}
.eat[aria-pressed=true]{background:rgba(34,197,94,.14);color:var(--ok);border-color:rgba(34,197,94,.4)}
.meal.eaten{opacity:.72}
.mhero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mhero div{background:rgba(255,255,255,.16);border-radius:14px;padding:9px 8px;text-align:center}
.mhero b{display:block;font:900 22px/1.05 var(--f-d)}
.mhero small{font:600 11.5px var(--f-c);letter-spacing:.6px;text-transform:uppercase;opacity:.9}
.shop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.shop:first-of-type{border-top:0}

.shop[aria-pressed=true] .bx{background:var(--ok);border-color:var(--ok)}.shop[aria-pressed=true] .bx svg{opacity:1}

.shop .nm{flex:1;font-size:15.5px}.shop .nm small{display:block;color:var(--tx3);font-size:12.5px}
.shop .q{font:700 15px var(--f-c);letter-spacing:.3px;color:var(--tx2);text-align:right}
.grp h3{font:800 16px var(--f-c);letter-spacing:1px;text-transform:uppercase;color:var(--tx2);margin-bottom:2px}

/* ---------------- progrès ---------------- */

.rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .nm{flex:1;min-width:0}
.rec .nm b{display:block;font:600 15px var(--f-b);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function slotOptions(sl) { return [sl.ex].concat(sl.alts || []); }

function allSlots() { const out = []; DAYS.forEach(d => (d.slots || []).concat((d.tech && d.tech.slots) || []).forEach(s => out.push(s))); return out; }

/* ---------------- programme ---------------- */
function progWeek(s = TODAY()) { const n = Math.floor((D(s) - D(S.start)) / 864e5); return n < 0 ? 0 : Math.floor(n / 7) + 1; }
function weekInfo(real = progWeek()) {
  const w = Math.min(12, Math.max(1, real));
  return { real, w, block: w <= 4 ? 0 : w <= 8 ? 1 : 2, learn: DATA.learn.includes(w), deload: DATA.deload.includes(w), before: real === 0, after: real > 12 };
}
const isMatchWeek = (wk = weekKey()) => !!S.match[wk];
function dayView(day, mode) {
  if (day.kind !== 'sunday') return Object.assign({}, day);
  const m = mode ? mode === 'match' : isMatchWeek();
  return Object.assign({}, day, m ? day.match : day.tech, { key: day.key, kind: m ? 'match' : 'tech' });
}
function presc(sl, info) {
  const base = sl.p[info.block]; if (!base) return null;
  let [sets, reps, rest] = base;
  if (info.learn && ['force', 'core', 'plyo'].includes(sl.kind) && sets > 2) sets = 2;
  if (info.deload) sets = Math.max(1, sets - 1);
  return { sets, reps, rest };
}
function planFor(day, mode, info = weekInfo()) {
  const v = dayView(day, mode);
  return (v.slots || []).map(sl => ({ sl, slug: slotSlug(sl), pr: presc(sl, info) })).filter(p => p.pr);
}
function repsFor(sl, slug, pr) { const e = EXD[slug]; return slug !== sl.ex && e.reps && !/\d\s*s\b/.test(pr.reps) ? e.reps : pr.reps; }
function topOf(reps) { const s = String(reps); if (/min|\bm\b/.test(s)) return null; const m = s.match(/(\d+)(?:\s*[–-]\s*(\d+))?/); return m ? +(m[2] || m[1]) : null; }
function modeOf(sl, slug, reps) {
  if (['plyo', 'sprint', 'cod', 'ball'].includes(sl.kind) || EXD[slug].eq === 'velo') return 'drill';
  if (/\d\s*s\b/.test(reps) && !/×/.test(reps)) return 'hold';
  return EXD[slug].step ? 'load' : 'reps';
}
const restTxt = s => !s ? '' : s >= 60 ? (s % 60 ? Math.floor(s / 60) + ' min ' + (s % 60) : s / 60 + ' min') : s + ' s';
const exName = slug => (EXD[slug] && EXD[slug].name) || DATA.oldnames[slug] || slug;
const exStep = slug => EXD[slug] ? EXD[slug].step : 1;
const exNeg = slug => !!(EXD[slug] && EXD[slug].neg);

function recordHist(slug, patch) {
  const h = S.hist[slug] || (S.hist[slug] = []);
  let e = h.find(x => x.d === TODAY());
  if (!e) { e = { d: TODAY() }; h.push(e); }
  Object.assign(e, patch);
  if (h.length > 80) h.splice(0, h.length - 80);
}
const doneOn = d => S.log.some(l => l.d === d);
function logDay(kind, name, col, extra) {
  S.log = S.log.filter(l => !(l.d === TODAY() && l.kind === kind));
  S.log.push(Object.assign({ d: TODAY(), day: todayKey(), kind, name, col }, extra || {}));
  S.log.sort((a, b) => a.d.localeCompare(b.d));
  if (S.log.length > 500) S.log.splice(0, S.log.length - 500);

}

let progDay = null, sunMode = {};

      : 'Le coach n’a pas pu répondre' + (e && e.detail ? ' (' + String(e.detail).slice(0, 120) + ')' : '') + '. Réessaie dans un instant.';
    bubble.className = 'msg bot err'; bubble.textContent = msg;
    if (answer.trim()) S.coach.msgs.push({ role: 'assistant', content: answer }); else S.coach.msgs.pop();
    if (c === 'not_configured' || c === 'no_code') { const n = document.getElementById('coachnote'); if (n) n.innerHTML = coachSetupHtml(); }
  } finally {
    coachBusy = false; coachAbort = null; save();
    if (tab === 'coach' && document.getElementById('chat') && !bubble.classList.contains('err')) renderCoach();
  }
}

/* ---------------- onglets ---------------- */
const TABS = ['accueil', 'programme', 'repas', 'coach'];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'accueil';
function render() {
  document.querySelectorAll('.nav [data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  view.className = '';
  ({ accueil: renderAccueil, programme: renderProgramme, repas: renderRepas, coach: renderCoach }[tab] || renderAccueil)();
}
function go(t) { tab = t; try { history.replaceState(null, '', '#' + t); } catch (e) {} render(); window.scrollTo(0, 0); }
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) { tab = h; render(); } });
function applyTheme() {
  let t = S.set.theme || 'auto';
  if (t === 'auto') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', t === 'light' ? '#F2F3F6' : '#0A0D13');
}
try { window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (S.set.theme === 'auto') applyTheme(); }); } catch (e) {}

/* ---------------- pages ---------------- */
document.querySelector('.nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
view.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.act === 'start') { startDay(d.day); return; }
  if (d.act === 'done') { const v = dayView(dayByKey(d.day), sunOf(d.day, weekKey())); logDay(v.kind, v.name, v.col); toast('Bien joué !'); rerender(); return; }
  if (d.go) { if (d.day) progDay = d.day; go(d.go); return; }
  if (d.sheet) { openSheet(d.sheet); return; }
  if (d.exd) { openSheet('ex', d.exd); return; }
  if (d.exr) { openSheet('exr', d.exr); return; }
  if (d.sun) { sunMode[weekKey()] = d.sun; if (d.sun === 'match') S.match[weekKey()] = true; else delete S.match[weekKey()]; save(); rerender(); return; }
  if (d.day) { progDay = d.day; rerender(); return; }
  if (d.mtab) { mealTab = d.mtab; rerender(); return; }
  if (d.mday) { mealDay = d.mday; rerender(); return; }
  if (d.shop) { S.shop.checked[d.shop] = !S.shop.checked[d.shop]; save(); rerender(); return; }
  if (d.shopreset) { S.shop.checked = {}; save(); rerender(); return; }
  if (d.q) { askCoach(d.q); return; }
  if (t.id === 'newchat') { if (coachAbort) coachAbort.abort(); S.coach.msgs = []; save(); render(); return; }
});
view.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'composer') { const ta = document.getElementById('ask'); const v = ta.value; ta.value = ''; askCoach(v); } });
view.addEventListener('input', e => { if (e.target.id === 'ask') { e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; } });
view.addEventListener('keydown', e => { if (e.target.id === 'ask' && e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) { e.preventDefault(); document.getElementById('composer').requestSubmit(); } });

/* ---------------- séance ---------------- */
WO.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !S.cur) return;
  const d = t.dataset, c = S.cur;
  if (d.var) { S.variant[d.var] = +d.i; save(); const y = WO.scrollTop; renderWO(); WO.scrollTop = y; return; }
  if (d.stp) { stepW(+d.stp); haptic(8); return; }
  const a = d.wo; if (!a) return;
  if (a === 'close') { closeWO(); return; }
  if (a === 'go') { c.step = 'ex'; if (!c.t0) c.t0 = Date.now(); save(); renderWO(); WO.scrollTop = 0; return; }
  if (a === 'set') { validateSet(); return; }
  if (a === 'hold') { const sec = +d.sec; unlockAudio(); wake(); if (!c.t0) c.t0 = Date.now(); startTimer(sec, 'hold', 'Garde la position', () => validateSet(sec)); return; }
  if (a === 'prev') { if (c.i > 0) { c.i--; save(); renderWO(); WO.scrollTop = 0; } return; }
  if (a === 'next') { c.i++; if (T.mode === 'rest') stopTimer(); save(); renderWO(); WO.scrollTop = 0; return; }
  if (a === 'end') { c.step = 'end'; stopTimer(); save(); renderWO(); WO.scrollTop = 0; return; }
  if (a === 'finish') { finishSession(); closeWO(); return; }
});
WO.addEventListener('change', e => { if (e.target.id === 'w-in' && S.cur) { const p = curPlan()[S.cur.i]; if (p) woW[p.sl.id + ':' + p.slug] = readW(); } });

/* ---------------- fiches ---------------- */
document.getElementById('sheet').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { closeSheet(); rerender(); return; }
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.svar) { S.variant[t.dataset.svar] = +t.dataset.i; save(); openSheet('ex', t.dataset.svar); return; }
  if (t.dataset.theme) { S.set.theme = t.dataset.theme; save(); applyTheme(); openSheet('settings'); return; }
  if (t.id === 'backup') { const txt = JSON.stringify(S); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Sauvegarde copiée : colle-la dans tes notes.'), () => { document.getElementById('restore').hidden = false; const ta = document.getElementById('restoretxt'); ta.value = txt; ta.select(); }); return; }
  if (t.id === 'restoreopen') { const r = document.getElementById('restore'); r.hidden = !r.hidden; return; }
  if (t.id === 'restoredo') {
    try { const o = JSON.parse(document.getElementById('restoretxt').value); if (!o || typeof o !== 'object') throw 0;
      if (o.v === 3) S = Object.assign(BLANK(), o); else if (o.v === 2 || o.weights) migrateV2(o); else throw 0;
      if (!S.start) S.start = defaultStart(); save(); toast('Sauvegarde restaurée.'); closeSheet(); applyTheme(); render(); } catch (err) { toast('Cette sauvegarde n’est pas valide.'); }
  }
});
document.getElementById('sheet').addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'sname') { S.name = el.value.trim().slice(0, 24); save(); }
  if (el.id === 'sstart' && el.value) { S.start = ymd(mondayOf(D(el.value))); el.value = S.start; save(); toast('Début : lundi ' + fmtDate(S.start)); }
  if (el.id === 'sbeep') { S.set.beep = el.checked; save(); }
  if (el.id === 'swake') { S.set.wake = el.checked; save(); }
  if (el.id === 'scode') { S.coach.code = el.value.trim(); save(); toast('Code enregistré.'); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (document.body.classList.contains('timer-on') && !tEl.classList.contains('go')) tickT();
  if (S.cur && WO.classList.contains('on')) wake();
  if (S.cur && S.cur.date !== TODAY()) { settleStale(); closeWO(); }
});

/* ---------------- démarrage ---------------- */
loadState(); applyTheme(); settleStale(); save();
render();
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}

</script>
</body>
</html>
