<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="N°10">
<meta name="description" content="Numéro 10 : ton programme de muscu, de vitesse et de technique, et tes repas.">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14603D">
<title>Numéro 10</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(fonts/archivo-latin-wdth-normal.woff2) format('woff2-variations'),url(fonts/archivo-latin-wdth-normal.woff2) format('woff2')}
:root{
  --page:#ECF0E9;--card:#FFFFFF;--ink:#14251C;--muted:#5A6960;--line:#DDE4DA;--tickb:#C5CFC3;
  --pitch:#14603D;--pitch2:#186C46;--num:#14603D;--chalk:#FFFFFF;--chalk2:rgba(255,255,255,.76);--chalk3:rgba(255,255,255,.22);
  --ball:#FF7A1F;--ok:#14603D;--on-ok:#FFFFFF;--red:#CC3A2C;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --f:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --page:#09110D;--card:#131E18;--ink:#E6EEE8;--muted:#92A398;--line:rgba(255,255,255,.09);--tickb:#3B4B41;
  --pitch:#0F4E32;--pitch2:#125839;--num:#45CF85;--ok:#45CF85;--on-ok:#05200F;--red:#FF6B5D;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--page);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:17px/1.4 var(--f);font-stretch:100%;min-height:100vh}
body.sheet-on{overflow:hidden}
button,input,textarea{font:inherit;font-stretch:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
h1,h2,h3,p,ul,ol,figure{margin:0}
a{color:var(--ok);text-decoration:none}
svg{display:block}
.xd{font-stretch:125%;font-weight:800;letter-spacing:-.015em}

/* le bandeau : un bout de terrain (bandes de tonte, ligne médiane, rond central) */
.band{position:relative;overflow:hidden;color:var(--chalk);background:repeating-linear-gradient(90deg,var(--pitch) 0 46px,var(--pitch2) 46px 92px);padding:calc(var(--safe-t) + 10px) 12px 48px}
.band .lines{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--chalk3);stroke-width:2.5;pointer-events:none}
.band.salle{--th-ink:#252B32;background:repeating-conic-gradient(#252B32 0 25%,#2B323A 0 50%) 0 0/92px 92px}
.plate-t{fill:var(--chalk3);stroke:none;font:800 22px var(--f);font-stretch:125%;text-anchor:middle}.plate-t.sm{font-size:15px}
.band .lines .spot{fill:var(--chalk3);stroke:none}
.band-in{position:relative;max-width:560px;margin:0 auto;padding:20px 8px 0}
.when{font-size:15px;font-weight:600;color:var(--chalk2)}
.band h1{font-size:46px;line-height:1;margin:2px 0 10px}
.what{font-size:21px;font-weight:650;line-height:1.2}
.meta{font-size:15px;color:var(--chalk2);margin-top:4px}
.band{--th-ink:#14603D}
.cta{margin-top:20px;height:52px;padding:0 28px;border-radius:14px;background:var(--chalk);color:var(--th-ink);font-size:18px;font-weight:750;font-stretch:112%}
.fini{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:11px 16px 11px 12px;border-radius:14px;background:rgba(255,255,255,.15);font-size:16px;font-weight:650;color:var(--chalk)}
.fini svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--chalk);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* les jours de la semaine */
.days{position:relative;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dy{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:12px;color:var(--chalk2);font-size:15px;font-weight:600}
.dy.sel{background:var(--chalk);color:var(--th-ink)}
.dy i{height:9px;display:grid;place-items:center}
.dy i.t::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ball)}
.dy i svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}

/* la feuille de match : les exercices du jour */
.page{position:relative;max-width:560px;margin:-28px auto 0;padding:0 12px calc(96px + var(--safe-b))}
.page.pc{margin-top:16px}
.lineup{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:12px}
.lineup.text{padding:18px 20px;font-size:17px;line-height:1.5}
.lh{font-size:15px;font-weight:650;color:var(--muted);padding:16px 20px 4px}
.xs{list-style:none;padding:0;margin:0}
.x{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr) 66px;grid-template-areas:'num tx tick' '. voir tick';align-items:center;padding:12px 0}
.x>.num{grid-area:num;align-self:start;padding-top:2px}
.x>.tx{grid-area:tx;text-align:left}
.x>.tick{grid-area:tick;height:auto;flex-direction:column;gap:3px;display:flex;align-items:center}
.tick small{font-size:12px;font-weight:600;color:var(--muted)}
.voir{grid-area:voir;justify-self:start;display:inline-flex;align-items:center;gap:7px;margin-top:9px;height:38px;padding:0 15px 0 11px;border-radius:19px;background:rgba(20,96,61,.1);color:var(--ok);font-size:15px;font-weight:700}
.voir svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}.voir svg .fill{fill:currentColor;stroke:none}
.x.on .num svg{width:26px;height:26px;fill:none;stroke:var(--ok);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.x::before{content:'';position:absolute;top:0;left:58px;right:0;border-top:1px solid var(--line)}
.lineup>.xs:first-child>.x:first-child::before,.lh+.xs>.x:first-child::before{display:none}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;width:100%;min-height:70px;padding:11px 12px 11px 0;text-align:left}
.x .row{grid-template-columns:58px minmax(0,1fr);padding-right:0}
.num{display:grid;place-items:center;font-size:27px;font-weight:800;font-stretch:125%;color:var(--num);font-variant-numeric:tabular-nums}
.num.ic svg{width:25px;height:25px;fill:none;stroke:var(--num);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx b{display:block;font-size:17px;font-weight:650;line-height:1.25}
.tx small{display:block;font-size:15px;color:var(--muted);margin-top:3px;line-height:1.3}
.x.on .tx b{color:var(--muted)}
.x.on .num{color:var(--tickb)}
.row .chev{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;margin-right:8px;transition:transform .2s}
.row[aria-expanded=true] .chev{transform:rotate(90deg)}
.tick{width:62px;height:70px;display:grid;place-items:center}
.tick svg{width:34px;height:34px;padding:6px;border-radius:50%;border:2px solid var(--tickb);fill:none;stroke:transparent;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;transition:background-color .15s,border-color .15s}
.tick[aria-pressed=true] svg{background:var(--ok);border-color:var(--ok);stroke:var(--on-ok)}
.tick.sm{width:40px;height:44px}
.tick.sm svg{width:26px;height:26px;padding:4px}
.warm-l{margin:-4px 20px 14px 58px;padding-left:18px;font-size:16px;line-height:1.45}
.warm-l li+li{margin-top:5px}
.foot{font-size:14px;color:var(--muted);line-height:1.45;margin:4px 10px 10px}

/* repas */
.meals .meal{padding:16px 20px}
.meals .meal+.meal{border-top:1px solid var(--line)}
.meal h2{font-size:17px;font-weight:700}
.meal .dish{font-size:15px;color:var(--muted);margin-top:2px}
.meal ul{margin-top:8px;padding-left:18px;font-size:16px;line-height:1.5}
.meal b{font-weight:650}
.shop-in{padding:0 14px 14px 20px}
.shop-in h3{font-size:14px;font-weight:650;color:var(--muted);margin:12px 0 0}
.shopl{list-style:none;padding:0;margin:0}
.shop{display:flex;align-items:center;gap:6px;min-height:44px}
.shop .nm{flex:1;font-size:16px}
.shop .q{font-size:15px;color:var(--muted)}
.shop.on .nm{color:var(--muted);text-decoration:line-through}

/* la fiche plein écran : un exercice par écran, on glisse au suivant */
#sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--page);transform:translateY(100%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s}
#sheet.on{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sh-top{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 8px) 16px 6px;max-width:560px;width:100%;margin:0 auto}
.shx{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.shx svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.segs{flex:1;display:flex;gap:5px}
.segs button{flex:1;height:30px;display:flex;align-items:center}
.segs button::before{content:'';flex:1;height:5px;border-radius:3px;background:var(--line);transition:background-color .2s,height .2s}
.segs button.d::before{background:var(--ok)}
.segs button.c::before{height:8px;background:var(--ink)}
.segs button.d.c::before{background:var(--ok)}
.swipe-hint{max-width:528px;width:100%;margin:0 auto;padding:0 20px 6px;font-size:14px;color:var(--muted);animation:hintout 1s 5s forwards}
@keyframes hintout{to{opacity:0}}
.track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overscroll-behavior-y:contain;padding:8px 16px 28px}
.card>*{max-width:528px;margin-left:auto;margin-right:auto}
.card h2.xd{font-size:27px;line-height:1.1;margin-top:18px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:650;color:var(--muted);margin-top:16px;margin-bottom:4px}
.lead{font-size:16px;color:var(--muted);margin-top:-6px;margin-bottom:14px}
.plain{padding-left:20px;font-size:16.5px;line-height:1.5}
.plain li+li{margin-top:4px}

/* le tableau de l'entraîneur : dessin à la craie sur le terrain */
.board{position:relative;border-radius:22px;padding:12px 10px 8px;background:repeating-linear-gradient(90deg,var(--pitch) 0 40px,var(--pitch2) 40px 80px)}
#sheet[data-th=salle] .board{background:repeating-conic-gradient(#252B32 0 25%,#2B323A 0 50%) 0 0/80px 80px}
#sheet[data-th=salle]{--halo:#252B32}
.board::after{content:'';position:absolute;inset:8px;border:2px solid var(--chalk3);border-radius:15px;pointer-events:none}
.board svg{position:relative;z-index:1;width:100%;height:auto;max-height:36vh}
.board.two{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:12px 12px 14px}
.board.two figure{position:relative;z-index:1}
.board.two figcaption{font-size:13px;line-height:1.25;color:var(--chalk2);text-align:center;padding:2px 4px 0}
.s-k{stroke:var(--chalk);fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-f{stroke:rgba(255,255,255,.42);fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-g{stroke:rgba(255,255,255,.5);fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-r{stroke:rgba(255,255,255,.35);fill:none;stroke-linecap:round}
.s-t{stroke:rgba(255,255,255,.2);fill:none}
.s-a{stroke:var(--ball);fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-ok{stroke:#86F0AE;fill:none;stroke-linecap:round}
.s-bad{stroke:#FF9384;fill:none;stroke-linecap:round}
.s-halo{stroke:var(--halo,var(--pitch));fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-q{stroke:var(--chalk2);fill:none}
.f-k{fill:var(--chalk)}.f-a{fill:var(--ball)}.f-eq{fill:rgba(255,255,255,.1)}.f-halo{fill:var(--pitch)}.f-none{fill:none}
.board .f-eq.s-k{fill:var(--chalk)}
.dia-b .dg-bg{fill:transparent}.dg-cone{fill:var(--ball)}.dg-ball{fill:#fff;stroke:var(--pitch);stroke-width:2}
.dg-pl{fill:var(--chalk)}.dg-pln{stroke:var(--chalk);stroke-width:4;stroke-linecap:round}.dg-pl2{fill:rgba(255,255,255,.5)}.dg-pl2n{stroke:rgba(255,255,255,.5);stroke-width:4;stroke-linecap:round}
.dg-run,.dg-drib,.dg-shot{fill:none;stroke:var(--chalk);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dg-drib{stroke:var(--ball);stroke-width:2.5}.dg-shot{stroke-width:3.5}
.dg-pass{fill:none;stroke:var(--chalk);stroke-width:2;stroke-dasharray:5 5}.dg-walk{fill:none;stroke:rgba(255,255,255,.55);stroke-width:2;stroke-dasharray:4 6}
.dg-alt{opacity:.4}.dg-ma{fill:var(--chalk)}.dg-md{fill:var(--ball)}.dg-mp{fill:var(--chalk)}.dg-mg{fill:rgba(255,255,255,.55)}
.dg-t{font:600 12px var(--f);fill:var(--chalk2)}.dg-zone{fill:#fff;opacity:.1}.dg-zone2{fill:none;stroke:var(--chalk2);stroke-width:2;stroke-dasharray:6 6}
.dg-wall{fill:rgba(255,255,255,.45)}.dg-goal{fill:none;stroke:var(--chalk);stroke-width:4;stroke-linejoin:round}.dg-line{stroke:rgba(255,255,255,.6);stroke-width:2}
.dg-meas{stroke:var(--chalk2);stroke-width:1.5;stroke-dasharray:3 4}.dg-sig{stroke:var(--ball);stroke-width:3;stroke-linecap:round}.dg-ang{fill:none;stroke:var(--chalk2);stroke-width:1.5}

/* les chiffres, comme au tableau d'affichage */
.score{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--card);border-radius:18px;padding:12px 0;margin-bottom:18px}
.score div{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 6px}
.score div+div{border-left:1px solid var(--line)}
.score b{font-size:28px;line-height:1.1}
.score small{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.2}
.steps{list-style:none;padding:0;counter-reset:s;margin-bottom:14px}
.steps li{counter-increment:s;position:relative;padding-left:36px;font-size:16.5px;line-height:1.45}
.steps li+li{margin-top:10px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;background:var(--card);color:var(--num);font-size:13px;font-weight:800;font-stretch:125%;display:grid;place-items:center}
.tip{display:flex;gap:11px;font-size:16.5px;line-height:1.45;margin-bottom:10px}
.tip svg{width:25px;height:25px;flex:none;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tip.ok svg{stroke:var(--ok)}.tip.no svg{stroke:var(--red)}
.wt{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--card);border-radius:16px;padding:12px 14px;margin-top:14px;margin-bottom:6px}
.wt label{font-weight:650}
.wt input{width:86px;height:42px;border-radius:11px;border:1.5px solid var(--line);background:var(--page);text-align:center;font-size:19px;font-weight:700}
.wt span{color:var(--muted)}
.wt small{flex-basis:100%;font-size:14px;color:var(--muted)}
.links{display:flex;flex-direction:column;align-items:flex-start;margin-top:6px}
.lnk{display:inline-flex;align-items:center;gap:9px;min-height:44px;color:var(--ok);font-size:16px;font-weight:650;line-height:1.3;padding:4px 0}
.lnk svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lnk svg .fill{fill:currentColor;stroke:none}
.lnk.center{display:flex;margin:10px auto 0}
.sh-bot{padding:10px 16px calc(var(--safe-b) + 12px);background:var(--page)}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:528px;margin:0 auto;height:58px;border-radius:17px;background:var(--pitch);color:#fff;font-size:18px;font-weight:750;font-stretch:112%}
.go svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.go.is-done{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}

/* coach */
.banner{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:12px;font-size:15.5px;line-height:1.45}
.banner p+p,.banner form+p{margin-top:10px}
.codef{display:flex;gap:8px;margin-top:10px}
.codef input{flex:1;min-width:0;height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--page);font-size:16px}
.codef button{padding:0 20px;border-radius:12px;background:var(--pitch);color:#fff;font-weight:700}
.quick .row{grid-template-columns:minmax(0,1fr) auto;padding-left:20px;min-height:58px}
.quick .row+.row{border-top:1px solid var(--line)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.42;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--pitch);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.msg p+p,.msg p+ul,.msg p+ol,.msg ul+p,.msg ol+p{margin-top:6px}
.msg ul,.msg ol{padding-left:20px}
.msg.err{color:var(--red)}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.coach-pad{height:66px}
.composer{position:fixed;left:0;right:0;bottom:calc(57px + var(--safe-b));padding:8px 12px;background:var(--page);z-index:15}
.composer form{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:22px;padding:9px 16px;background:var(--card);font-size:16px;line-height:1.35;max-height:140px}
.composer button{width:40px;height:40px;border-radius:50%;background:var(--pitch);display:grid;place-items:center;flex:none}
.composer button svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* barre d'onglets */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:saturate(170%) blur(18px);backdrop-filter:saturate(170%) blur(18px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav [aria-current=page]{color:var(--num)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.ask{margin-top:18px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.14)}
.ask p{font-size:17px;font-weight:650}
.ask div{display:flex;gap:10px;margin-top:10px}
.ask button{flex:1;text-align:center;height:46px;border-radius:12px;background:var(--chalk);color:var(--th-ink);font-size:17px;font-weight:750}

</style>
</head>
<body>
<main id="view" aria-live="polite"></main>
<section id="sheet" role="dialog" aria-modal="true" aria-label="Exercice" aria-hidden="true"></section>

  if (!a.length) delete S.checks[d];
  const now = dayDone(k);
  if (now !== was) {   // l'historique garde les jours faits
    S.log = S.log.filter(l => l.d !== d);
    if (now) {
      const day = dayByKey(k), match = k === 'dimanche' && checked(d, 'm1');
      const v = k === 'dimanche' ? (match ? day.match : day.tech) : day;
      S.log.push({ d, day: k, kind: k === 'dimanche' ? (match ? 'match' : 'tech') : day.kind, name: v.name, col: v.col || day.col });

// Le squelette (art.py) donne pour chaque point soit un trajet en ligne droite, soit un segment
// qui tourne autour de son articulation : les bras et les jambes gardent leur longueur.
const f1 = x => Math.round(x * 10) / 10;
function rigFrame(R, t) {
  const P = [], N = R.n;
  for (let i = 0; i < N.length; i++) {
    const d = N[i];
    if (d[0] === 0) P.push([d[1] + (d[3] - d[1]) * t, d[2] + (d[4] - d[2]) * t]);
    else { const p = P[d[1]], l = d[2] + (d[3] - d[2]) * t, a = d[4] + d[5] * t; P.push([p[0] + l * Math.cos(a), p[1] + l * Math.sin(a)]); }
  }
  if (R.h) { const o = R.h * Math.sin(Math.PI * t); R.m.forEach(i => { P[i] = [P[i][0], P[i][1] - o]; }); }
  return P;
}
const ptsStr = (P, ids) => ids.map(i => f1(P[i][0]) + ',' + f1(P[i][1])).join(' ');
function rigMarkup(R, P) {
  return R.it.map(it => {
    switch (it[0]) {
      case 'p': return `<polyline points="${ptsStr(P, it[4])}" class="${it[1]}" stroke-width="${it[2]}"${it[3] ? ` stroke-dasharray="${it[3]}"` : ''}/>`;
      case 'n': { const s = ptsStr(P, it[1]); return `<polyline points="${s}" class="s-halo" stroke-width="17"/><polyline points="${s}" class="s-k" stroke-width="12"/>`; }
      case 'c': { const p = P[it[3]]; return `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${it[2]}" class="${it[1]}"/>`; }
      case 'r': { const p = P[it[4]]; return `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${it[3]}" class="${it[1]}" stroke-width="${it[2]}"/>`; }
      case 'b': { const p = P[it[4]]; return `<rect x="${f1(p[0])}" y="${f1(p[1])}" width="${it[1]}" height="${it[2]}" rx="${it[3]}" class="f-eq s-g" stroke-width="2"/>`; }
    }
    return '';
  }).join('');
}
function rigApply(svg, R, P) {
  const els = svg.children; let k = 0;
  R.it.forEach(it => {
    switch (it[0]) {
      case 'p': els[k++].setAttribute('points', ptsStr(P, it[4])); break;
      case 'n': { const s = ptsStr(P, it[1]); els[k++].setAttribute('points', s); els[k++].setAttribute('points', s); break; }
      case 'c': case 'r': { const p = P[it[it.length - 1]]; els[k].setAttribute('cx', f1(p[0])); els[k++].setAttribute('cy', f1(p[1])); break; }
      case 'b': { const p = P[it[4]]; els[k].setAttribute('x', f1(p[0])); els[k++].setAttribute('y', f1(p[1])); break; }
    }
  });
}
function figHtml(slug) {   // le « tableau » : terrain rayé, dessin à la craie
  const e = EXD[slug];
  if (e.dia) return `<div class="board dia-b">${e.dia}</div>`;
  if (e.rig) return `<div class="board"><svg data-rig="${slug}" viewBox="${e.rig.vb.join(' ')}" aria-hidden="true">${rigMarkup(e.rig, rigFrame(e.rig, 0))}</svg></div>`;
  return `<div class="board two"><figure>${e.a}<figcaption>${esc(e.ca)}</figcaption></figure><figure>${e.b}<figcaption>${esc(e.cb)}</figcaption></figure></div>`;
}
let figRaf = 0;
function playFig(svg) {
  cancelAnimationFrame(figRaf);
  if (!svg) return;
  const R = EXD[svg.dataset.rig].rig;
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  const HOLD = 550, MOVE = 1300, PER = 2 * (HOLD + MOVE), T0 = performance.now();
  const step = now => {
    if (!svg.isConnected) return;
    const x = (now - T0) % PER;
    const t = x < HOLD ? 0 : x < HOLD + MOVE ? (x - HOLD) / MOVE : x < 2 * HOLD + MOVE ? 1 : 1 - (x - 2 * HOLD - MOVE) / MOVE;
    rigApply(svg, R, rigFrame(R, (1 - Math.cos(Math.PI * t)) / 2));
    figRaf = requestAnimationFrame(step);
  };
  figRaf = requestAnimationFrame(step);
}

function prescLine(sl, slug, pr) {
  const reps = repsFor(sl, slug, pr);
  return (pr.sets > 1 ? `${pr.sets}&nbsp;×&nbsp;${esc(reps)}` : esc(reps)) + (pr.rest ? `, repos ${restTxt(pr.rest)}` : '');
}
function scoreItems(sl, slug, pr) {   // les trois chiffres de la fiche : séries, répétitions, repos
  const reps = String(repsFor(sl, slug, pr)), out = [];
  if (pr.sets > 1) out.push([String(pr.sets), 'séries']);
  const m = reps.match(/^(\d+(?:\s*[–-]\s*\d+)?)\s*(.*)$/);
  if (!m) out.push([esc(reps), '']);
  else {
    const n = m[1], rest = m[2].replace(/^,\s*/, '');
    if (rest === '') out.push([n, 'répétitions']);
    else if (/^(s|min)$/.test(rest)) out.push([n + '&nbsp;' + rest, rest === 's' ? 'tenue' : 'durée']);
    else if (rest === 'm') out.push([n + '&nbsp;m', 'distance']);
    else if (/^m\b/.test(rest)) out.push([n + '&nbsp;m', rest.replace(/^m\s*\+?\s*/, 'puis ')]);
    else out.push([n, /^(par |passes|passage)/.test(rest) ? rest : 'répétitions, ' + rest]);
  }
  if (pr.rest) out.push([pr.rest < 60 ? pr.rest + '&nbsp;s' : pr.rest % 60 ? Math.floor(pr.rest / 60) + ':' + p2(pr.rest % 60) : pr.rest / 60 + '&nbsp;min', 'repos']);
  return out;
}

function onTrack() {
  cancelAnimationFrame(trackRaf);
  trackRaf = requestAnimationFrame(() => {
    const tr = document.getElementById('track'); if (!tr || !SH) return;
    const i = Math.max(0, Math.min(SH.deck.length - 1, Math.round(tr.scrollLeft / tr.clientWidth)));
    if (i !== SH.i) { SH.i = i; syncSheet(); }
  });
}
const smooth = () => { try { return !matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return true; } };
function goCard(i) { const tr = document.getElementById('track'); if (tr) tr.scrollTo({ left: i * tr.clientWidth, behavior: smooth() ? 'smooth' : 'auto' }); }
function openSheet(which, i) {
  SH = { k: selDay, which, i };
  sheetEl().dataset.th = themeOf(selDay);
  document.body.classList.add('sheet-on');
  sheetEl().setAttribute('aria-hidden', 'false');
  sheetEl().classList.add('on');
  renderSheet();
}
function closeSheet() {
  cancelAnimationFrame(figRaf);
  sheetEl().classList.remove('on');
  sheetEl().setAttribute('aria-hidden', 'true');
  document.body.classList.remove('sheet-on');
  SH = null;
  rerender();
  setTimeout(() => { if (!SH) sheetEl().innerHTML = ''; }, 350);
}

/* ---------------- REPAS ---------------- */
function qtyLabel(f, q) {
  const x = F(f), n = s => esc(s.replace(' (poids cru)', ''));
  if (x.per === 'g') return `<b>${q}&nbsp;g</b> ${n(x.n)}`;
  if (x.unit) return `<b>${q} ${esc(x.unit)}${q > 1 && !/\./.test(x.unit) ? 's' : ''}</b> ${n(x.n)}`;
  return `<b>${q}</b> ${n(q > 1 && x.pl ? x.pl : x.n)}`;
}
function renderRepas() {
  const dn = nomJour(selDay), r = mealsFor(dn);
  view.innerHTML = band(`${selDay === todayKey() ? '<p class="when">Aujourd’hui</p>' : ''}<h1 class="xd">${dn}</h1><p class="what">Repas</p><p class="meta">Environ ${fr0(r.md.target)}&nbsp;kcal</p>`, true, themeOf(selDay))
    + `<div class="page"><section class="lineup meals">${r.meals.map(m => `<div class="meal"><h2>${esc(m.name)}</h2>${m.title ? `<p class="dish">${esc(m.title)}</p>` : ''}<ul>${Object.keys(m.items).map(f => `<li>${qtyLabel(f, m.items[f])}</li>`).join('')}</ul></div>`).join('')}</section>
    ${dn === 'Samedi' || dn === 'Dimanche' ? '<p class="foot">Match le lendemain : ajoute 40&nbsp;g de pâtes au dîner. Jour de match : repas 3&nbsp;h avant.</p>' : ''}
    <p class="foot">Poulet, pâtes et riz pesés crus. Une seule whey par jour.</p>
    <section class="lineup"><button type="button" class="row" data-shopopen="1" aria-expanded="${shopOpen}"><span class="num ic">${I.cart}</span><span class="tx"><b>Liste de courses</b><small>Pour toute la semaine</small></span>${I.chev}</button>${shopOpen ? `<div class="shop-in">${coursesHtml()}</div>` : ''}</section></div>`;
}
const GROUPS = [['Viande, poisson, œufs', ['poulet', 'oeuf', 'meuniere', 'thon', 'sardines']], ['Laitier, whey', ['skyr', 'whey']], ['Féculents', ['pates', 'riz', 'wedges', 'avoine', 'pain']], ['Fruits et légumes', ['banane', 'fruit', 'tomate', 'salade', 'legumes']], ['Épicerie', ['sauce', 'amandes', 'huile', 'miel']]];
function buyText(f, q) {
  const r = x => Math.ceil(x / 50) * 50;
  switch (f) {
    case 'poulet': case 'skyr': return (Math.ceil(q / 100) / 10).toLocaleString('fr-FR') + '&nbsp;kg';
    case 'whey': return q + ' doses';
    case 'meuniere': return q + ' filet' + (q > 1 ? 's' : '');
    case 'thon': case 'sardines': return '1 boîte';
    case 'salade': return q + ' bols';
    case 'huile': return q + ' c. à soupe';
    case 'miel': return q + ' c. à café';
    case 'pain': return q + ' tranches';
    case 'oeuf': case 'banane': case 'fruit': case 'tomate': return String(q);
    default: return r(q) + '&nbsp;g';
  }
}
function coursesHtml() {
  const wk = weekKey();
  if (!S.shop || S.shop.week !== wk) S.shop = { week: wk, checked: {} };
  const tot = {};
  ORDER.forEach(k => mealsFor(nomJour(k)).meals.forEach(m => { for (const f in m.items) tot[f] = (tot[f] || 0) + m.items[f]; }));
  return GROUPS.map(([g, list]) => {
    const rows = list.filter(f => tot[f]).map(f => { const on = !!S.shop.checked[f]; return `<li class="shop${on ? ' on' : ''}"><button type="button" class="tick sm" data-shop="${f}" aria-pressed="${on}" aria-label="${esc(F(f).n)}">${I.check}</button><span class="nm">${esc((tot[f] > 1 && F(f).pl ? F(f).pl : F(f).n).replace(/ \(.*\)$/, ''))}</span><span class="q">${buyText(f, tot[f])}</span></li>`; }).join('');
    return rows ? `<h3>${g}</h3><ul class="shopl">${rows}</ul>` : '';
  }).join('') + (Object.keys(S.shop.checked).length ? '<button type="button" class="lnk" data-shopreset="1"><span>Tout décocher</span></button>' : '');
}

/* ---------------- coach IA ---------------- */
const QUICK = ['Cette machine n’est pas dans ma salle, je fais quoi ?', 'J’ai mal quelque part, je fais quoi ?', 'Que manger avant mon match ?'];
let coachBusy = false, coachMode = null, sampler = null, coachAbort = null;
async function detectCoach() {
  if (coachMode) return coachMode;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      sampler = await window.claude.use('sample');
      if (sampler) return (coachMode = 'sample');
    }
  } catch (e) {}
  return (coachMode = location.protocol.startsWith('http') && !/claude\.ai$|claudeusercontent/.test(location.hostname) ? 'api' : 'none');
}
function coachSystem() {
  const info = weekInfo(), day = dayByKey(todayKey()), v = dayView(day), L = [];
  L.push('Tu es le coach intégré à l’app de musculation et de préparation foot de ce joueur. Tu réponds en français, tu tutoies, simplement et brièvement.');
  L.push('Profil : homme, 26 ans, 1,76 m, environ 82 kg, débutant en salle, milieu offensif de foot à 7. Il veut des choses simples. Il n’aime pas la poulie : n’en propose jamais. Halal, pas de viande rouge, pas de légumineuses, une seule whey par jour.');
  L.push('Semaine : lundi haut du corps A, mardi bas du corps, mercredi foot avec l’équipe, jeudi récupération, vendredi vitesse, samedi haut du corps B, dimanche match ou technique.');
  L.push(`Aujourd’hui : ${JOURS[new Date().getDay()]}, ${v.name}${info.before ? '' : `, semaine ${info.w} sur 12`}. ` + ((v.slots || []).length ? 'Exercices : ' + planFor(day).map(p => `${EXD[p.slug].name} ${p.pr.sets} × ${repsFor(p.sl, p.slug, p.pr)}`).join(' ; ') + '.' : ''));
  const loads = Object.keys(S.hist).map(k => { const h = S.hist[k], l = h[h.length - 1]; return l && l.w ? `${exName(k)} ${l.w} kg` : ''; }).filter(Boolean);
  if (loads.length) L.push('Dernières charges : ' + loads.slice(-12).join(' ; ') + '.');
  L.push('Règles : réponses courtes (moins de 120 mots), simples, avec séries × répétitions si tu proposes un exercice. Exercices simples seulement : haltères, machines guidées sans poulie, poids du corps, ou terrain avec plots et ballon. Douleur : arrêter l’exercice, consulter si elle est vive ou dure plusieurs jours, jamais de diagnostic. Mise en forme : phrases simples, listes avec « - », gras avec ** sur les mots clés.');
  return L.join('\n');
}
function md(t) {
  const lines = esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split(/\n/);
  let html = '', list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  lines.forEach(l => {
    const ul = l.match(/^\s*[-•*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) { const t2 = ul ? 'ul' : 'ol'; if (list !== t2) { close(); html += `<${t2}>`; list = t2; } html += `<li>${(ul || ol)[1]}</li>`; }
    else if (!l.trim()) close();
    else { close(); html += `<p>${l.replace(/^#+\s*/, '')}</p>`; }
  });
  close(); return html;
}
function coachSetupHtml() {
  return `<div class="banner"><p>Pour utiliser le coach sur ce site, entre ton code :</p>
    <form id="codeform" class="codef"><input type="password" id="ccode" autocomplete="off" placeholder="Ton code" aria-label="Code du coach"><button type="submit">OK</button></form>
    <p>Ou gratuitement avec ton abonnement Claude : <a href="${DATA.artifact}#coach" target="_blank" rel="noopener">ouvrir le coach dans Claude</a>.</p></div>`;
}
function renderCoach() {
  const msgs = S.coach.msgs, empty = !msgs.length;
  view.className = '';
  view.innerHTML = band(`<h1 class="xd">Coach</h1><p class="what">Une question ? Demande.</p><p class="meta">Un exercice, une douleur, un repas</p>`, false) + `<div class="page pc">
    <div id="coachnote"></div>
    ${empty ? `<section class="lineup quick">${QUICK.map(q => `<button type="button" class="row" data-q="${esc(q)}"><span class="tx"><b>${esc(q)}</b></span>${I.chev}</button>`).join('')}</section>` : ''}
    <div class="chat" id="chat">${msgs.map(m => m.role === 'user' ? `<div class="msg user">${esc(m.content)}</div>` : `<div class="msg bot">${md(m.content)}</div>`).join('')}</div>
    ${empty ? '' : '<button type="button" class="lnk center" id="newchat"><span>Nouvelle conversation</span></button>'}
    <div class="coach-pad"></div></div>
    <div class="composer"><form id="composer"><textarea id="ask" rows="1" placeholder="Écris ta question…" aria-label="Ta question"></textarea><button type="submit" aria-label="Envoyer">${I.send}</button></form></div>`;
  detectCoach().then(mode => {
    const note = document.getElementById('coachnote'); if (!note) return;
    if (mode === 'api' && !S.coach.code) note.innerHTML = coachSetupHtml();
    if (mode === 'none') note.innerHTML = '<div class="banner">Le coach a besoin d’une connexion à Internet.</div>';
  });
  if (!empty) setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0);
}
async function askCoach(text) {
  if (coachBusy || !text.trim()) return;
  const mode = await detectCoach();
  coachBusy = true;
  S.coach.msgs.push({ role: 'user', content: text.trim().slice(0, 2000) });
  if (S.coach.msgs.length > 40) S.coach.msgs.splice(0, S.coach.msgs.length - 40);
  save(); renderCoach();
  const chat = document.getElementById('chat');
  const bubble = document.createElement('div'); bubble.className = 'msg bot'; bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  chat.appendChild(bubble); window.scrollTo(0, document.body.scrollHeight);
  const history = S.coach.msgs.slice(-16).filter((m, i) => i > 0 || m.role === 'user');
  let answer = '';
  const onText = t => { answer = t; bubble.innerHTML = md(t); };
  try {
    if (mode === 'sample') {
      const sys = coachSystem();
      const input = history.map((m, i) => i === 0 ? { role: 'user', content: sys + '\n\n---\nQuestion : ' + m.content } : m);
      const res = await sampler(input, { onText: ({ text }) => onText(text), cache: false, modelTier: 'default' });
      answer = (res && res.text) || answer;
    } else if (mode === 'api') {
      if (!S.coach.code) throw { code: 'no_code' };
      coachAbort = new AbortController();
      const res = await fetch('/api/coach', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: S.coach.code, system: coachSystem(), messages: history }), signal: coachAbort.signal });
      if (!res.ok) { let j = {}; try { j = await res.json(); } catch (e) {} throw { code: j.error || 'http_' + res.status, detail: j.detail }; }
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          chunk.split('\n').forEach(line => {
            if (!line.startsWith('data:')) return;
            let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { return; }
            if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') onText(answer + ev.delta.text);
            else if (ev.type === 'error') throw { code: 'upstream', detail: ev.error && ev.error.message };
          });
        }
      }
    } else throw { code: 'offline' };
    if (!answer.trim()) throw { code: 'empty' };
    S.coach.msgs.push({ role: 'assistant', content: answer });
  } catch (e) {
    const c = (e && e.code) || 'error';
    const msg = c === 'no_code' || c === 'bad_code' ? 'Code du coach manquant ou incorrect : entre-le en haut de cette page.'
      : c === 'not_configured' ? 'Le coach n’est pas encore activé sur ce site. Utilise le lien vers Claude en haut de la page.'
      : c === 'bad_key' ? 'La clé Claude enregistrée dans Netlify n’est pas valide : vérifie la variable ANTHROPIC_API_KEY.'
      : c === 'rate_limited' ? 'Trop de questions d’un coup : réessaie dans une minute.'
      : c === 'not_granted' ? 'Tu as refusé l’accès à Claude pour cette page : le coach ne peut pas répondre ici.'
      : c === 'offline' ? 'Pas de connexion : le coach a besoin d’Internet.'
      : 'Le coach n’a pas pu répondre' + (e && e.detail ? ' (' + String(e.detail).slice(0, 120) + ')' : '') + '. Réessaie dans un instant.';
    bubble.className = 'msg bot err'; bubble.textContent = msg;
    if (answer.trim()) S.coach.msgs.push({ role: 'assistant', content: answer }); else S.coach.msgs.pop();
    if (c === 'not_configured' || c === 'no_code' || c === 'bad_code') { const n = document.getElementById('coachnote'); if (n) n.innerHTML = coachSetupHtml(); }
  } finally {
    coachBusy = false; coachAbort = null; save();
    if (tab === 'coach' && document.getElementById('chat') && !bubble.classList.contains('err')) renderCoach();
  }
}

/* ---------------- onglets ---------------- */
const TABS = ['seance', 'repas', 'coach'];
const OLD_TABS = { accueil: 'seance', programme: 'seance' };
let tab = (h => TABS.includes(h) ? h : OLD_TABS[h] || 'seance')(location.hash.slice(1));
function render() {
  document.querySelectorAll('.nav [data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  ({ seance: renderSeance, repas: renderRepas, coach: renderCoach }[tab] || renderSeance)();
}
function go(t) { tab = t; try { history.replaceState(null, '', '#' + t); } catch (e) {} render(); window.scrollTo(0, 0); }
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.includes(h) && h !== tab) { tab = h; render(); } });
function applyTheme() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', dark ? '#0F4C31' : '#14603D');
}
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}
const buzz = () => { if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} } };

/* ---------------- page ---------------- */
document.querySelector('.nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
view.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.day) { if (d.day !== selDay) { selDay = d.day; warmOpen = false; shopOpen = false; render(); } return; }
  if (d.ck) { if (toggleCheck(selDay, d.ck)) buzz(); rerender(); return; }
  if (d.start) {   // la première fiche pas encore faite
    const deck = deckFor(selDay, d.start), dd = dateOf(selDay);
    const i = deck.findIndex(c => !checked(dd, c.id));
    openSheet(d.start, Math.max(0, i)); return;
  }
  if (d.deck) { openSheet(d.deck, +d.i); return; }
  if (d.match) { S.match[weekKey()] = d.match === '1'; save(); rerender(); return; }
  if (d.warm) { warmOpen = !warmOpen; rerender(); return; }
  if (d.shopopen) { shopOpen = !shopOpen; rerender(); return; }
  if (d.shop) { S.shop.checked[d.shop] = !S.shop.checked[d.shop]; save(); rerender(); return; }
  if (d.shopreset) { S.shop.checked = {}; save(); rerender(); return; }
  if (d.q) { askCoach(d.q); return; }
  if (t.id === 'newchat') { if (coachAbort) coachAbort.abort(); S.coach.msgs = []; save(); render(); return; }
});
view.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'composer') { const ta = document.getElementById('ask'); const v = ta.value; ta.value = ''; ta.style.height = ''; askCoach(v); }
  if (e.target.id === 'codeform') { const v = document.getElementById('ccode').value.trim(); if (v) { S.coach.code = v; save(); render(); } }
});
view.addEventListener('input', e => { if (e.target.id === 'ask') { e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; } });
view.addEventListener('keydown', e => { if (e.target.id === 'ask' && e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer: fine)').matches) { e.preventDefault(); document.getElementById('composer').requestSubmit(); } });

/* ---------------- fiche plein écran ---------------- */
const SHEET = document.getElementById('sheet');
SHEET.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || !SH) return;
  const d = t.dataset;
  if (d.close) { closeSheet(); return; }
  if (d.seg) { goCard(+d.seg); return; }
  if (d.alt) {   // machine prise : on garde la même fiche, avec l'autre exercice
    S.variant[d.alt] = +d.j; save();
    const tr = document.getElementById('track'), y = tr.children[SH.i].scrollTop;
    renderSheet(); document.getElementById('track').children[SH.i].scrollTop = y; return;
  }
  if (d.done) {
    const c = SH.deck[SH.i], dd = dateOf(SH.k), was = checked(dd, c.id);
    if (toggleCheck(SH.k, c.id)) buzz();
    syncSheet();
    if (was) return;   // on vient d'annuler : on reste sur la fiche
    const n = SH.deck.length, next = [...Array(n).keys()].map(j => (SH.i + 1 + j) % n).find(j => !checked(dd, SH.deck[j].id));
    if (next == null) setTimeout(closeSheet, 450);   // tout est fait
    else setTimeout(() => goCard(next), 250);
  }
});
SHEET.addEventListener('change', e => { const el = e.target; if (el.dataset.w && SH) { const w = num(el.value); setW(el.dataset.w, dateOf(SH.k), w != null && w >= 0 ? w : null); } });
SHEET.addEventListener('keydown', e => { if (e.target.dataset && e.target.dataset.w && e.key === 'Enter') e.target.blur(); });
document.addEventListener('keydown', e => {
  if (!SH) return;
  if (e.key === 'Escape') closeSheet();
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' && SH.i < SH.deck.length - 1) goCard(SH.i + 1);
  if (e.key === 'ArrowLeft' && SH.i > 0) goCard(SH.i - 1);
});
window.addEventListener('resize', () => { if (SH) { const tr = document.getElementById('track'); if (tr) tr.scrollLeft = SH.i * tr.clientWidth; } });

let lastToday = TODAY();
document.addEventListener('visibilitychange', () => {
  if (document.hidden || SH) return;
  if (TODAY() !== lastToday) { lastToday = TODAY(); selDay = todayKey(); }
  if (tab !== 'coach') rerender();
});

/* ---------------- démarrage ---------------- */
loadState(); applyTheme(); save();
render();
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}

</script>
